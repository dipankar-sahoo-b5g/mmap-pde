<template>
    <lightning-card class="mmap-header-card slds-m-around_medium">
        <!-- Header Title Banner -->
        <div slot="title" class="slds-media slds-media_center">
            <div class="slds-media__figure">
                <lightning-icon icon-name="custom:custom18" size="medium"></lightning-icon>
            </div>
            <div class="slds-media__body">
                <h1 class="slds-card__header-title slds-truncate mmap-title slds-text-heading_medium">
                    Commonwealth Commercial Licensing & Application Wizard
                </h1>
                <p class="slds-text-body_small slds-text-color_weak">
                    Department of Health • Medical Marijuana Regulatory Oversight Platform (MMAP)
                </p>
            </div>
        </div>

        <!-- Action / Status Controls in Header -->
        <div slot="actions">
            <lightning-button-icon icon-name="utility:refresh" alternative-text="Refresh Data" title="Refresh Applications" onclick={loadApplications} class="slds-m-right_xx-small"></lightning-button-icon>
        </div>

        <!-- Spinner -->
        <template if:true={isLoading}>
            <lightning-spinner alternative-text="Processing..." size="medium"></lightning-spinner>
        </template>

        <!-- Main Wizard Body -->
        <div class="slds-p-around_medium">

            <!-- Submission Completed Success Banner -->
            <template if:true={isSubmitted}>
                <div class="slds-notify slds-notify_alert slds-alert_success slds-m-bottom_medium slds-box" role="alert">
                    <lightning-icon icon-name="utility:success" variant="inverse" size="small" class="slds-m-right_x-small"></lightning-icon>
                    <div>
                        <h2><strong>Application Successfully Filed!</strong> Your commercial license filing has been submitted to the Bureau of Medical Marijuana.</h2>
                        <p class="slds-m-top_xx-small">Record ID: <strong>{submittedRecordId}</strong></p>
                    </div>
                </div>

                <div class="slds-align_absolute-center slds-m-vertical_large">
                    <lightning-button variant="brand" label="Submit Another Application" icon-name="utility:add" onclick={handleReset} class="slds-m-right_small"></lightning-button>
                    <lightning-button variant="neutral" label="View Application Record" icon-name="utility:preview" data-id={submittedRecordId} onclick={navigateToRecord}></lightning-button>
                </div>
            </template>

            <!-- Active Intake Form Steps -->
            <template if:false={isSubmitted}>
                <!-- Stepper Progress Bar -->
                <lightning-progress-indicator current-step={currentStep} type="path" variant="base" class="slds-m-bottom_large">
                    <template for:each={steps} for:item="step">
                        <lightning-progress-step label={step.label} value={step.value} key={step.value}></lightning-progress-step>
                    </template>
                </lightning-progress-indicator>

                <!-- Error Alert Box -->
                <template if:true={errorMessage}>
                    <div class="slds-notify slds-notify_alert slds-alert_error slds-m-bottom_medium" role="alert">
                        <lightning-icon icon-name="utility:error" variant="inverse" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                        <h2>{errorMessage}</h2>
                    </div>
                </template>

                <!-- STEP 1: Facility & Application Category -->
                <template if:true={isStep1}>
                    <div class="mmap-step-container">
                        <div class="slds-grid slds-wrap slds-gutters">
                            <div class="slds-col slds-size_1-of-1 slds-medium-size_7-of-12">
                                <h3 class="slds-text-heading_small slds-m-bottom_small slds-text-color_default">
                                    <strong>Step 1: Entity & Operating License Tier</strong>
                                </h3>

                                <div class="slds-form-element slds-m-bottom_medium">
                                    <lightning-combobox
                                        name="facility"
                                        label="Facility Applicant Entity"
                                        value={selectedFacilityId}
                                        placeholder="Search and select registered commercial facility..."
                                        options={facilityOptions}
                                        onchange={handleFacilityChange}
                                        required>
                                    </lightning-combobox>
                                </div>

                                <div class="slds-form-element slds-m-bottom_medium">
                                    <lightning-combobox
                                        name="appType"
                                        label="Operating License Category"
                                        value={selectedAppType}
                                        placeholder="Select authorized commercial category..."
                                        options={appTypeOptions}
                                        onchange={handleAppTypeChange}
                                        required>
                                    </lightning-combobox>
                                </div>

                                <div class="mmap-callout-info slds-m-top_medium">
                                    <p class="slds-text-body_small">
                                        <strong>Statutory Guidance:</strong> Commercial medical cannabis licenses are issued under the Commonwealth Medical Marijuana Act (Act 16). Each category requires distinct site security, seed-to-sale telemetry, and statutory filing fees.
                                    </p>
                                </div>
                            </div>

                            <div class="slds-col slds-size_1-of-1 slds-medium-size_5-of-12 slds-m-top_medium slds-m-medium-top_none">
                                <div class="mmap-fee-box">
                                    <div class="slds-text-title_caps slds-text-color_weak slds-m-bottom_xx-small">Statutory Application Fee</div>
                                    <div class="mmap-fee-box-amount">{formattedCalculatedFee}</div>
                                    <p class="slds-text-body_small slds-m-top_x-small slds-text-color_weak">
                                        Non-refundable statutory filing assessment due upon formal submission.
                                    </p>
                                </div>

                                <template if:true={selectedFacilityObject}>
                                    <div class="slds-box slds-box_small slds-m-top_small slds-theme_shade">
                                        <div class="slds-text-title_bold slds-m-bottom_xx-small">Selected Facility Info</div>
                                        <p class="slds-text-body_small"><strong>Registry ID:</strong> {selectedFacilityRegistryId}</p>
                                        <p class="slds-text-body_small"><strong>Premise Type:</strong> {selectedFacilityObject.Facility_Type__c}</p>
                                    </div>
                                </template>
                            </div>
                        </div>

                        <!-- Step 1 Navigation -->
                        <div class="slds-m-top_large slds-grid slds-grid_align-end">
                            <lightning-button
                                variant="brand"
                                label="Next: Premise Details"
                                icon-name="utility:forward"
                                icon-position="right"
                                onclick={handleNext}
                                disabled={isStep1NextDisabled}>
                            </lightning-button>
                        </div>
                    </div>
                </template>

                <!-- STEP 2: Premise & Canopy Capacity -->
                <template if:true={isStep2}>
                    <div class="mmap-step-container">
                        <h3 class="slds-text-heading_small slds-m-bottom_small slds-text-color_default">
                            <strong>Step 2: Operational Premise & Cultivation Footprint</strong>
                        </h3>

                        <div class="slds-form slds-form_stacked">
                            <div class="slds-form-element slds-m-bottom_medium">
                                <lightning-textarea
                                    name="premiseAddress"
                                    label="Physical Premise Address"
                                    value={premiseAddress}
                                    placeholder="Enter complete facility street address, city, state, zip..."
                                    onchange={handleAddressChange}
                                    required>
                                </lightning-textarea>
                            </div>

                            <template if:true={isGrowerProcessor}>
                                <div class="mmap-callout-warning slds-m-bottom_medium">
                                    <p class="slds-text-body_small">
                                        <strong>Cultivation Canopy Mandate:</strong> Grower/Processor facilities must record their planned flowering canopy footprint. Under regulation 28 Pa. Code § 1151, canopy space must be strictly greater than 0 square feet.
                                    </p>
                                </div>

                                <div class="slds-form-element slds-size_1-of-1 slds-medium-size_1-of-2 slds-m-bottom_medium">
                                    <lightning-input
                                        type="number"
                                        name="canopySqFt"
                                        label="Estimated Plant Canopy Area (Square Feet)"
                                        value={canopySqFt}
                                        placeholder="e.g. 25000"
                                        min="1"
                                        step="1"
                                        onchange={handleCanopyChange}
                                        required>
                                    </lightning-input>
                                </div>
                            </template>
                        </div>

                        <!-- Step 2 Navigation -->
                        <div class="slds-m-top_large slds-grid slds-grid_align-spread">
                            <lightning-button
                                variant="neutral"
                                label="Back"
                                icon-name="utility:back"
                                onclick={handleBack}>
                            </lightning-button>
                            <lightning-button
                                variant="brand"
                                label="Next: Review & Submit"
                                icon-name="utility:forward"
                                icon-position="right"
                                onclick={handleNext}>
                            </lightning-button>
                        </div>
                    </div>
                </template>

                <!-- STEP 3: Statutory Fee Review & Legal Certification -->
                <template if:true={isStep3}>
                    <div class="mmap-step-container">
                        <h3 class="slds-text-heading_small slds-m-bottom_small slds-text-color_default">
                            <strong>Step 3: Filing Summary & Statutory Attestation</strong>
                        </h3>

                        <div class="mmap-review-card slds-m-bottom_medium">
                            <div class="slds-grid slds-wrap slds-gutters">
                                <div class="slds-col slds-size_1-of-1 slds-medium-size_6-of-12 slds-m-bottom_small">
                                    <div class="slds-text-title_caps slds-text-color_weak">Facility Applicant</div>
                                    <div class="slds-text-heading_small"><strong>{selectedFacilityName}</strong></div>
                                    <div class="slds-text-body_small slds-text-color_weak">Registry ID: {selectedFacilityRegistryId}</div>
                                </div>
                                <div class="slds-col slds-size_1-of-1 slds-medium-size_6-of-12 slds-m-bottom_small">
                                    <div class="slds-text-title_caps slds-text-color_weak">License Category</div>
                                    <div class="slds-text-heading_small"><strong>{selectedAppType}</strong></div>
                                </div>
                                <div class="slds-col slds-size_1-of-1 slds-medium-size_6-of-12 slds-m-bottom_small">
                                    <div class="slds-text-title_caps slds-text-color_weak">Operating Premise</div>
                                    <div class="slds-text-body_regular">{premiseAddress}</div>
                                </div>
                                <div class="slds-col slds-size_1-of-1 slds-medium-size_3-of-12 slds-m-bottom_small">
                                    <div class="slds-text-title_caps slds-text-color_weak">Canopy Footprint</div>
                                    <div class="slds-text-body_regular">
                                        <template if:true={canopySqFt}>{canopySqFt} sq ft</template>
                                        <template if:false={canopySqFt}>N/A</template>
                                    </div>
                                </div>
                                <div class="slds-col slds-size_1-of-1 slds-medium-size_3-of-12 slds-m-bottom_small">
                                    <div class="slds-text-title_caps slds-text-color_weak">Statutory Fee</div>
                                    <div class="slds-text-heading_small slds-text-color_success"><strong>{formattedCalculatedFee}</strong></div>
                                </div>
                            </div>
                        </div>

                        <!-- Legal Attestation -->
                        <div class="slds-box slds-theme_shade slds-m-bottom_medium">
                            <div class="slds-form-element">
                                <div class="slds-form-element__control">
                                    <div class="slds-checkbox">
                                        <abbr class="slds-required" title="required">* </abbr>
                                        <input type="checkbox" id="attestation-checkbox" checked={attestationAccepted} onchange={handleAttestationChange} />
                                        <label class="slds-checkbox__label" for="attestation-checkbox">
                                            <span class="slds-checkbox_faux"></span>
                                            <span class="slds-form-element__label slds-text-body_small">
                                                <strong>Applicant Certification & Attestation:</strong> I hereby certify under penalty of perjury under 18 Pa.C.S. § 4904 that all information submitted in this application is true, correct, and complete to the best of my knowledge. I understand that false statements will result in immediate license rejection and potential criminal prosecution.
                                            </span>
                                        </label>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Step 3 Navigation -->
                        <div class="slds-m-top_large slds-grid slds-grid_align-spread">
                            <lightning-button
                                variant="neutral"
                                label="Back"
                                icon-name="utility:back"
                                onclick={handleBack}
                                disabled={isSubmitting}>
                            </lightning-button>
                            <lightning-button
                                variant="brand"
                                label="Submit Application"
                                icon-name="utility:send"
                                onclick={handleSubmit}
                                disabled={isSubmitDisabled}>
                            </lightning-button>
                        </div>
                    </div>
                </template>
            </template>

            <!-- APPLICATIONS REGULATORY QUEUE TABLE -->
            <div class="slds-m-top_x-large">
                <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-m-bottom_small">
                    <div>
                        <h2 class="slds-text-heading_small slds-text-title_bold slds-text-color_default">
                            Regulatory License Applications Queue
                        </h2>
                        <p class="slds-text-body_small slds-text-color_weak">
                            Real-time state intake queue ({filteredApplications.length} records)
                        </p>
                    </div>
                    <div class="slds-size_1-of-3">
                        <lightning-input
                            type="search"
                            label="Filter applications"
                            placeholder="Filter by app#, facility, category..."
                            value={searchTerm}
                            onchange={handleSearchChange}
                            variant="label-hidden">
                        </lightning-input>
                    </div>
                </div>

                <div class="mmap-table-container">
                    <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_striped" aria-label="License Applications Table">
                        <thead>
                            <tr class="slds-line-height_reset">
                                <th scope="col"><div class="slds-truncate" title="Application #">Application #</div></th>
                                <th scope="col"><div class="slds-truncate" title="Facility Applicant">Facility Applicant</div></th>
                                <th scope="col"><div class="slds-truncate" title="Category">Category</div></th>
                                <th scope="col"><div class="slds-truncate" title="Status">Status</div></th>
                                <th scope="col"><div class="slds-truncate" title="Canopy SqFt">Canopy SqFt</div></th>
                                <th scope="col"><div class="slds-truncate" title="Statutory Fee">Statutory Fee</div></th>
                                <th scope="col"><div class="slds-truncate" title="Submitted Date">Submitted Date</div></th>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={filteredApplications} for:item="app">
                                <tr key={app.Id}>
                                    <th scope="row">
                                        <a href="javascript:void(0);" data-id={app.Id} onclick={navigateToRecord} class="slds-truncate">
                                            <strong>{app.Name}</strong>
                                        </a>
                                    </th>
                                    <td>
                                        <div class="slds-truncate" title={app.facilityName}>{app.facilityName}</div>
                                    </td>
                                    <td>
                                        <div class="slds-truncate" title={app.Application_Type__c}>{app.Application_Type__c}</div>
                                    </td>
                                    <td>
                                        <span class={app.statusClass}>{app.Status__c}</span>
                                    </td>
                                    <td>
                                        <div class="slds-truncate">{app.formattedCanopy}</div>
                                    </td>
                                    <td>
                                        <div class="slds-truncate">{app.formattedFee}</div>
                                    </td>
                                    <td>
                                        <lightning-formatted-date-time
                                            value={app.Submission_Date__c}
                                            year="numeric"
                                            month="short"
                                            day="2-digit"
                                            hour="2-digit"
                                            minute="2-digit">
                                        </lightning-formatted-date-time>
                                    </td>
                                </tr>
                            </template>
                            <template if:false={filteredApplications.length}>
                                <tr>
                                    <td colspan="7" class="slds-text-align_center slds-p-around_medium slds-text-color_weak">
                                        No license applications matching current criteria.
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </lightning-card>
</template>
