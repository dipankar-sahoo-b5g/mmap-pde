<template>
    <div class="mmap-container slds-card slds-p-around_medium">
        <!-- Main Component Header -->
        <header class="slds-page-header slds-page-header_record-home slds-m-bottom_medium header-container">
            <div class="slds-page-header__row">
                <div class="slds-page-header__col-title">
                    <div class="slds-media">
                        <div class="slds-media__figure">
                            <lightning-icon icon-name="standard:coaching" size="large" alternative-text="Audit Engine"></lightning-icon>
                        </div>
                        <div class="slds-media__body">
                            <div class="slds-page-header__name">
                                <div class="slds-page-header__name-title">
                                    <h1>
                                        <span class="slds-page-header__title slds-truncate" title="On-Site Regulatory Auditing & Field Inspection Engine">
                                            Field Inspection & Statewide Stop-Sale Quarantine Engine
                                        </span>
                                    </h1>
                                </div>
                            </div>
                            <p class="slds-page-header__name-meta">
                                Commonwealth Medical Marijuana Regulatory Authority &bull; Division of Field Enforcement &bull; Section 704 Emergency Mandate
                            </p>
                        </div>
                    </div>
                </div>
                <div class="slds-page-header__col-actions">
                    <div class="slds-page-header__controls">
                        <div class="slds-page-header__control">
                            <lightning-button-group>
                                <lightning-button
                                    label="Refresh Audits"
                                    icon-name="utility:refresh"
                                    onclick={handleRefresh}>
                                </lightning-button>
                                <lightning-button
                                    label="New Field Audit"
                                    icon-name="utility:add"
                                    variant="brand"
                                    onclick={openNewAuditModal}>
                                </lightning-button>
                            </lightning-button-group>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <!-- Emergency Active Stop-Sale Quarantine Banner (Visible when selected audit is quarantined) -->
        <template lwc:if={isQuarantineActive}>
            <div class="emergency-banner slds-m-bottom_medium slds-p-around_medium" role="alert">
                <div class="slds-grid slds-grid_vertical-align-center slds-wrap">
                    <div class="slds-col slds-size_12-of-12 slds-medium-size_8-of-12 slds-grid slds-grid_vertical-align-center">
                        <lightning-icon icon-name="utility:warning" size="medium" variant="inverse" class="slds-m-right_small pulse-icon"></lightning-icon>
                        <div>
                            <h2 class="emergency-title">STATEWIDE EMERGENCY STOP-SALE ORDER ENACTED</h2>
                            <p class="emergency-subtitle">
                                Facility Compliance Status: <strong>SUSPENDED</strong>. All commercial transfers, retail dispensing, and wholesale shipments are legally barred. All facility inventory packages are locked in <strong>QUARANTINED</strong> status.
                            </p>
                            <template lwc:if={selectedAudit.Stop_Sale_Timestamp__c}>
                                <p class="emergency-meta">Enacted: {formattedQuarantineTimestamp}</p>
                            </template>
                        </div>
                    </div>
                    <div class="slds-col slds-size_12-of-12 slds-medium-size_4-of-12 slds-text-align_right slds-m-top_small slds-medium-m-top_none">
                        <lightning-button
                            variant="inverse"
                            label="Rescind / Lift Stop-Sale"
                            icon-name="utility:undo"
                            class="lift-quarantine-btn"
                            onclick={openLiftModal}>
                        </lightning-button>
                    </div>
                </div>
            </div>
        </template>

        <!-- Failing Audit Alert (Failing score, but quarantine not yet enacted) -->
        <template lwc:if={isFailingAuditNotice}>
            <div class="warning-banner slds-m-bottom_medium slds-p-around_medium" role="alert">
                <div class="slds-grid slds-grid_vertical-align-center slds-wrap">
                    <div class="slds-col slds-size_12-of-12 slds-medium-size_8-of-12 slds-grid slds-grid_vertical-align-center">
                        <lightning-icon icon-name="utility:error" size="medium" variant="warning" class="slds-m-right_small"></lightning-icon>
                        <div>
                            <h2 class="warning-title">CRITICAL COMPLIANCE FAILURE (Score: {selectedAudit.Audit_Score__c}/100)</h2>
                            <p class="warning-subtitle">
                                Facility failed statutory threshold (&lt; 70). Commonwealth regulations mandate immediate consideration of Statewide Emergency Stop-Sale Quarantine.
                            </p>
                        </div>
                    </div>
                    <div class="slds-col slds-size_12-of-12 slds-medium-size_4-of-12 slds-text-align_right slds-m-top_small slds-medium-m-top_none">
                        <lightning-button
                            variant="destructive"
                            label="Enact Statewide Stop-Sale"
                            icon-name="utility:ban"
                            onclick={openEnactModal}>
                        </lightning-button>
                    </div>
                </div>
            </div>
        </template>

        <!-- Main Workspace: Split View -->
        <div class="slds-grid slds-wrap slds-gutters">
            <!-- Left Column: Audits List Explorer -->
            <div class="slds-col slds-size_12-of-12 slds-large-size_4-of-12 slds-m-bottom_medium">
                <article class="slds-card explorer-card">
                    <div class="slds-card__header slds-grid slds-grid_vertical-align-center">
                        <header class="slds-media slds-media_center slds-has-flexi-truncate">
                            <div class="slds-media__figure">
                                <lightning-icon icon-name="standard:record" size="small"></lightning-icon>
                            </div>
                            <div class="slds-media__body">
                                <h2 class="slds-card__header-title">
                                    <span class="slds-text-heading_small">Inspection Registry ({auditsCount})</span>
                                </h2>
                            </div>
                        </header>
                    </div>

                    <!-- Search Filter -->
                    <div class="slds-p-horizontal_medium slds-p-bottom_small">
                        <lightning-input
                            type="search"
                            label="Filter Audits"
                            variant="label-hidden"
                            placeholder="Search facility or audit #..."
                            value={searchKey}
                            onchange={handleSearchChange}>
                        </lightning-input>
                    </div>

                    <!-- Audits Card List -->
                    <div class="audit-list-scroll slds-p-horizontal_small">
                        <template lwc:if={isLoading}>
                            <div class="slds-p-around_large slds-text-align_center">
                                <lightning-spinner alternative-text="Loading Audits" size="medium"></lightning-spinner>
                            </div>
                        </template>

                        <template lwc:if={hasFilteredAudits}>
                            <template for:each={filteredAudits} for:item="item">
                                <div
                                    key={item.audit.Id}
                                    class={item.cardCssClass}
                                    onclick={handleSelectAudit}
                                    data-id={item.audit.Id}>
                                    <div class="slds-grid slds-grid_vertical-align-center slds-m-bottom_xx-small">
                                        <div class="slds-col slds-has-flexi-truncate">
                                            <span class="audit-name-tag">{item.audit.Name}</span>
                                        </div>
                                        <div class="slds-col slds-no-flex">
                                            <span class={item.gradeBadgeClass}>{item.audit.Compliance_Grade__c}</span>
                                        </div>
                                    </div>
                                    <h3 class="facility-title slds-truncate" title={item.facilityName}>
                                        {item.facilityName}
                                    </h3>
                                    <div class="slds-grid slds-grid_vertical-align-center slds-m-top_xx-small slds-text-body_small">
                                        <div class="slds-col slds-has-flexi-truncate text-muted">
                                            <span>{item.audit.Inspection_Type__c}</span> &bull; <span>{item.audit.Inspection_Date__c}</span>
                                        </div>
                                        <div class="slds-col slds-no-flex">
                                            <span class="score-pill">Score: {item.audit.Audit_Score__c}</span>
                                        </div>
                                    </div>
                                    <template lwc:if={item.audit.Stop_Sale_Enacted__c}>
                                        <div class="slds-m-top_xx-small">
                                            <span class="stop-sale-badge">QUARANTINE ACTIVE</span>
                                        </div>
                                    </template>
                                </div>
                            </template>
                        </template>

                        <template lwc:if={noAuditsFound}>
                            <div class="slds-p-around_medium slds-text-align_center text-muted">
                                No inspection audits match the search filter.
                            </div>
                        </template>
                    </div>
                </article>
            </div>

            <!-- Right Column: Inspection Scorecard & Findings -->
            <div class="slds-col slds-size_12-of-12 slds-large-size_8-of-12">
                <template lwc:if={hasSelectedAudit}>
                    <article class="slds-card scorecard-card">
                        <!-- Scorecard Top Profile Header -->
                        <div class="scorecard-header slds-p-around_medium">
                            <div class="slds-grid slds-wrap slds-grid_vertical-align-center">
                                <div class="slds-col slds-size_12-of-12 slds-medium-size_7-of-12">
                                    <span class="slds-badge slds-badge_lightest slds-m-bottom_xx-small">{selectedAudit.Name}</span>
                                    <h2 class="scorecard-facility-title">{selectedAuditFacilityName}</h2>
                                    <p class="scorecard-submeta text-muted">
                                        Premise ID: <strong>{selectedAuditFacilityPremiseId}</strong> &bull;
                                        Type: <strong>{selectedAudit.Inspection_Type__c}</strong> &bull;
                                        Date: <strong>{selectedAudit.Inspection_Date__c}</strong>
                                    </p>
                                    <p class="scorecard-submeta text-muted">
                                        Inspector: <strong>{selectedAuditInspectorName}</strong> &bull;
                                        Facility Standing: <span class={facilityStandingBadgeClass}>{selectedAuditFacilityCompliance}</span>
                                    </p>
                                </div>

                                <!-- Circular / Large Score Badge -->
                                <div class="slds-col slds-size_12-of-12 slds-medium-size_5-of-12 slds-text-align_center slds-medium-text-align_right slds-m-top_small slds-medium-m-top_none">
                                    <div class={scoreBoxClass}>
                                        <div class="score-number">{selectedAudit.Audit_Score__c}</div>
                                        <div class="score-max">/ 100</div>
                                        <div class="score-grade-tag">{selectedAudit.Compliance_Grade__c}</div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- KPI Summary Cards -->
                        <div class="slds-p-around_medium">
                            <div class="slds-grid slds-gutters slds-wrap">
                                <div class="slds-col slds-size_6-of-12 slds-medium-size_3-of-12 slds-m-bottom_small">
                                    <div class="kpi-card">
                                        <div class="kpi-label">Total Findings</div>
                                        <div class="kpi-value">{totalFindingsCount}</div>
                                    </div>
                                </div>
                                <div class="slds-col slds-size_6-of-12 slds-medium-size_3-of-12 slds-m-bottom_small">
                                    <div class="kpi-card kpi-danger">
                                        <div class="kpi-label">Critical Violations</div>
                                        <div class="kpi-value">{criticalFindingsCount}</div>
                                    </div>
                                </div>
                                <div class="slds-col slds-size_6-of-12 slds-medium-size_3-of-12 slds-m-bottom_small">
                                    <div class="kpi-card kpi-warning">
                                        <div class="kpi-label">Unresolved</div>
                                        <div class="kpi-value">{unresolvedFindingsCount}</div>
                                    </div>
                                </div>
                                <div class="slds-col slds-size_6-of-12 slds-medium-size_3-of-12 slds-m-bottom_small">
                                    <div class="kpi-card">
                                        <div class="kpi-label">Fines Assessed</div>
                                        <div class="kpi-value">{formattedTotalFines}</div>
                                    </div>
                                </div>
                            </div>

                            <!-- Executive Summary Findings Narrative -->
                            <template lwc:if={selectedAudit.Summary_Findings__c}>
                                <div class="summary-narrative-box slds-m-vertical_small">
                                    <div class="summary-label">
                                        <lightning-icon icon-name="utility:note" size="x-small" class="slds-m-right_xx-small"></lightning-icon>
                                        Executive Audit Narrative &amp; Regulatory Log
                                    </div>
                                    <p class="summary-text">{selectedAudit.Summary_Findings__c}</p>
                                </div>
                            </template>

                            <!-- Enforcement Actions Toolbar -->
                            <div class="enforcement-bar slds-p-around_small slds-m-bottom_medium slds-grid slds-grid_vertical-align-center slds-wrap">
                                <div class="slds-col slds-size_12-of-12 slds-medium-size_8-of-12">
                                    <span class="enforcement-label">Regulatory Enforcement Actions:</span>
                                    <template lwc:if={selectedAudit.Stop_Sale_Enacted__c}>
                                        <span class="status-indicator-quarantined slds-m-left_small">STOP-SALE ENFORCED</span>
                                    </template>
                                    <template lwc:else>
                                        <span class="status-indicator-normal slds-m-left_small">STANDARD OPERATIONS</span>
                                    </template>
                                </div>
                                <div class="slds-col slds-size_12-of-12 slds-medium-size_4-of-12 slds-text-align_right slds-m-top_x-small slds-medium-m-top_none">
                                    <template lwc:if={selectedAudit.Stop_Sale_Enacted__c}>
                                        <lightning-button
                                            variant="neutral"
                                            label="Rescind Stop-Sale Order"
                                            icon-name="utility:undo"
                                            onclick={openLiftModal}>
                                        </lightning-button>
                                    </template>
                                    <template lwc:else>
                                        <lightning-button
                                            variant="destructive"
                                            label="Enact Statewide Stop-Sale"
                                            icon-name="utility:ban"
                                            onclick={openEnactModal}>
                                        </lightning-button>
                                    </template>
                                </div>
                            </div>

                            <!-- Findings Table / Datatable -->
                            <h3 class="section-heading slds-m-bottom_small">
                                Citations &amp; Audit Deficiencies ({totalFindingsCount})
                            </h3>

                            <template lwc:if={hasFindings}>
                                <div class="slds-table_responsive">
                                    <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_col-bordered findings-table">
                                        <thead>
                                            <tr class="slds-line-height_reset">
                                                <th scope="col" style="width: 15%;">Finding #</th>
                                                <th scope="col" style="width: 25%;">Compliance Category</th>
                                                <th scope="col" style="width: 15%;">Severity</th>
                                                <th scope="col" style="width: 15%;">Statutory Fine</th>
                                                <th scope="col" style="width: 20%;">Mandated Corrective Action</th>
                                                <th scope="col" style="width: 10%;">Resolution</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <template for:each={findingsList} for:item="finding">
                                                <tr key={finding.Id} class="slds-hint-parent">
                                                    <td data-label="Finding #">
                                                        <strong>{finding.Name}</strong>
                                                    </td>
                                                    <td data-label="Category">
                                                        <span>{finding.Finding_Category__c}</span>
                                                    </td>
                                                    <td data-label="Severity">
                                                        <span class={finding.severityBadgeClass}>{finding.Severity__c}</span>
                                                    </td>
                                                    <td data-label="Statutory Fine">
                                                        <span>{finding.formattedFine}</span>
                                                    </td>
                                                    <td data-label="Corrective Action">
                                                        <span class="action-plan-text" title={finding.Corrective_Action_Plan__c}>
                                                            {finding.Corrective_Action_Plan__c}
                                                        </span>
                                                    </td>
                                                    <td data-label="Resolution">
                                                        <template lwc:if={finding.Resolved__c}>
                                                            <span class="slds-badge slds-badge_success">Resolved</span>
                                                        </template>
                                                        <template lwc:else>
                                                            <span class="slds-badge slds-badge_warning">Pending</span>
                                                        </template>
                                                    </td>
                                                </tr>
                                            </template>
                                        </tbody>
                                    </table>
                                </div>
                            </template>

                            <template lwc:else>
                                <div class="slds-p-around_large slds-text-align_center clean-record-box">
                                    <lightning-icon icon-name="utility:approval" size="medium" variant="success" class="slds-m-bottom_x-small"></lightning-icon>
                                    <div class="slds-text-heading_small slds-text-color_success">Zero Statutory Violations Cited</div>
                                    <p class="text-muted">Facility passed all physical security, scale calibration, pesticide storage, and tracking standards.</p>
                                </div>
                            </template>
                        </div>
                    </article>
                </template>

                <template lwc:else>
                    <article class="slds-card slds-p-around_large slds-text-align_center empty-selection-card">
                        <lightning-icon icon-name="standard:coaching" size="large" class="slds-m-bottom_medium"></lightning-icon>
                        <h2 class="slds-text-heading_medium">Select an Inspection Audit</h2>
                        <p class="text-muted slds-m-top_small">
                            Choose an audit from the left registry to review scorecard metrics, citations, and manage stop-sale quarantine orders.
                        </p>
                    </article>
                </template>
            </div>
        </div>

        <!-- MODAL: Enact Statewide Stop-Sale Order -->
        <template lwc:if={isEnactModalOpen}>
            <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open slds-modal_medium" aria-modal="true">
                <div class="slds-modal__container">
                    <header class="slds-modal__header enact-modal-header">
                        <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" onclick={closeEnactModal} title="Close">
                            <lightning-icon icon-name="utility:close" alternative-text="close" size="small"></lightning-icon>
                        </button>
                        <h2 class="slds-text-heading_medium modal-title-danger">
                            🚨 Enact Statewide Emergency Stop-Sale Order
                        </h2>
                        <p class="slds-m-top_x-small modal-subtitle">
                            Section 704 Statutory Emergency Lockdown Mandate
                        </p>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium">
                        <div class="enact-warning-box slds-m-bottom_medium slds-p-around_medium">
                            <div class="slds-grid slds-grid_vertical-align-center">
                                <lightning-icon icon-name="utility:warning" size="medium" variant="error" class="slds-m-right_small"></lightning-icon>
                                <div>
                                    <div class="danger-highlight">CRITICAL REGULATORY NOTICE</div>
                                    <p class="slds-text-body_small">
                                        Enacting this emergency order will immediately:
                                    </p>
                                    <ul class="slds-list_dotted slds-text-body_small slds-m-top_xx-small">
                                        <li>Update facility <strong>{selectedAuditFacilityName}</strong> compliance status to <strong>SUSPENDED</strong>.</li>
                                        <li>Lock all facility product inventory packages into <strong>QUARANTINED</strong> status with safety status <strong>FAILED</strong>.</li>
                                        <li>Enforce an immediate statewide commercial sales and wholesale transfer embargo.</li>
                                    </ul>
                                </div>
                            </div>
                        </div>

                        <lightning-textarea
                            label="Emergency Stop-Sale Justification & Statutory Rationale"
                            placeholder="Enter detailed citation reasons, public health/safety threats, and evidence justifying immediate stop-sale..."
                            required
                            value={enactReason}
                            onchange={handleEnactReasonChange}
                            rows="4">
                        </lightning-textarea>

                        <div class="slds-m-top_medium">
                            <lightning-input
                                type="checkbox"
                                label="I certify under penalty of administrative perjury that this emergency order is warranted by imminent health/safety hazards under Commonwealth regulations."
                                checked={enactAttestationChecked}
                                onchange={handleEnactAttestationChange}>
                            </lightning-input>
                        </div>
                    </div>
                    <footer class="slds-modal__footer">
                        <lightning-button label="Cancel" onclick={closeEnactModal} class="slds-m-right_small"></lightning-button>
                        <lightning-button
                            variant="destructive"
                            label="Enact Statewide Stop-Sale Order"
                            icon-name="utility:ban"
                            disabled={isEnactButtonDisabled}
                            onclick={submitEnactStopSale}>
                        </lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>

        <!-- MODAL: Lift / Rescind Quarantine Order -->
        <template lwc:if={isLiftModalOpen}>
            <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open" aria-modal="true">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <button class="slds-button slds-button_icon slds-modal__close" onclick={closeLiftModal} title="Close">
                            <lightning-icon icon-name="utility:close" alternative-text="close" size="small"></lightning-icon>
                        </button>
                        <h2 class="slds-text-heading_medium">
                            Rescind Statewide Stop-Sale Quarantine Order
                        </h2>
                        <p class="slds-m-top_x-small text-muted">
                            Restoring commercial compliance for {selectedAuditFacilityName}
                        </p>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium">
                        <p class="slds-m-bottom_medium">
                            Commonwealth regulatory inspectors must verify that all critical infractions have been fully remediated and validated prior to rescinding a statewide stop-sale order.
                        </p>
                        <lightning-textarea
                            label="Remediation Verification & Regulatory Justification"
                            placeholder="Detail re-testing results, corrective action verifications, and justification for rescinding the stop-sale order..."
                            required
                            value={liftReason}
                            onchange={handleLiftReasonChange}
                            rows="4">
                        </lightning-textarea>
                    </div>
                    <footer class="slds-modal__footer">
                        <lightning-button label="Cancel" onclick={closeLiftModal} class="slds-m-right_small"></lightning-button>
                        <lightning-button
                            variant="brand"
                            label="Confirm & Lift Quarantine"
                            icon-name="utility:undo"
                            disabled={isLiftButtonDisabled}
                            onclick={submitLiftStopSale}>
                        </lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>

        <!-- MODAL: Create New Audit Scorecard -->
        <template lwc:if={isNewAuditModalOpen}>
            <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open slds-modal_large" aria-modal="true">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <button class="slds-button slds-button_icon slds-modal__close" onclick={closeNewAuditModal} title="Close">
                            <lightning-icon icon-name="utility:close" alternative-text="close" size="small"></lightning-icon>
                        </button>
                        <h2 class="slds-text-heading_medium">
                            Create New Field Inspection Audit Scorecard
                        </h2>
                        <p class="slds-m-top_x-small text-muted">
                            Commonwealth Regulatory On-Site Facility Evaluation &amp; Deficiency Citation Log
                        </p>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium new-audit-content">
                        <!-- Step 1: Inspection Parameters -->
                        <div class="slds-box slds-m-bottom_medium">
                            <h3 class="section-heading slds-m-bottom_small">1. Audit Scope &amp; Facility Metadata</h3>
                            <div class="slds-grid slds-gutters slds-wrap">
                                <div class="slds-col slds-size_12-of-12 slds-medium-size_6-of-12 slds-m-bottom_small">
                                    <lightning-combobox
                                        label="Regulated Facility"
                                        placeholder="Select Licensed Commercial Facility..."
                                        options={facilityOptions}
                                        value={newAuditFacilityId}
                                        onchange={handleFacilitySelect}
                                        required>
                                    </lightning-combobox>
                                </div>
                                <div class="slds-col slds-size_12-of-12 slds-medium-size_6-of-12 slds-m-bottom_small">
                                    <lightning-combobox
                                        label="Regulatory Inspector"
                                        placeholder="Select Authorized Inspector..."
                                        options={inspectorOptions}
                                        value={newAuditInspectorId}
                                        onchange={handleInspectorSelect}>
                                    </lightning-combobox>
                                </div>
                                <div class="slds-col slds-size_12-of-12 slds-medium-size_4-of-12 slds-m-bottom_small">
                                    <lightning-combobox
                                        label="Inspection Type"
                                        options={inspectionTypeOptions}
                                        value={newAuditType}
                                        onchange={handleAuditTypeSelect}
                                        required>
                                    </lightning-combobox>
                                </div>
                                <div class="slds-col slds-size_12-of-12 slds-medium-size_4-of-12 slds-m-bottom_small">
                                    <lightning-input
                                        type="date"
                                        label="Inspection Date"
                                        value={newAuditDate}
                                        onchange={handleAuditDateChange}
                                        required>
                                    </lightning-input>
                                </div>
                                <div class="slds-col slds-size_12-of-12 slds-medium-size_4-of-12 slds-m-bottom_small">
                                    <lightning-input
                                        type="number"
                                        label="Overall Score (0 - 100)"
                                        min="0"
                                        max="100"
                                        value={newAuditScore}
                                        onchange={handleScoreChange}
                                        required>
                                    </lightning-input>
                                    <!-- Live Grade Preview -->
                                    <div class="slds-m-top_xx-small">
                                        <span class="text-muted slds-text-body_small">Grade: </span>
                                        <span class={calculatedGradeBadgeClass}>{calculatedGradeText}</span>
                                    </div>
                                </div>
                                <div class="slds-col slds-size_12-of-12">
                                    <lightning-textarea
                                        label="Executive Summary Narrative"
                                        placeholder="Enter summary audit findings, premise overview, and inspector conclusions..."
                                        value={newAuditNotes}
                                        onchange={handleNotesChange}
                                        rows="3">
                                    </lightning-textarea>
                                </div>
                            </div>
                        </div>

                        <!-- Step 2: Findings & Citations Builder -->
                        <div class="slds-box">
                            <div class="slds-grid slds-grid_vertical-align-center slds-m-bottom_small">
                                <div class="slds-col slds-has-flexi-truncate">
                                    <h3 class="section-heading">2. Inspection Findings &amp; Statutory Citations ({newFindingsCount})</h3>
                                </div>
                                <div class="slds-col slds-no-flex">
                                    <lightning-button
                                        label="Add Finding"
                                        icon-name="utility:add"
                                        onclick={handleAddFindingRow}>
                                    </lightning-button>
                                </div>
                            </div>

                            <template lwc:if={hasNewFindings}>
                                <template for:each={newFindings} for:item="f" for:index="index">
                                    <div key={f.key} class="finding-row-box slds-m-bottom_small slds-p-around_small">
                                        <div class="slds-grid slds-grid_vertical-align-center slds-m-bottom_xx-small">
                                            <div class="slds-col slds-has-flexi-truncate">
                                                <span class="finding-row-badge">Finding #{f.displayIndex}</span>
                                            </div>
                                            <div class="slds-col slds-no-flex">
                                                <lightning-button-icon
                                                    icon-name="utility:delete"
                                                    alternative-text="Remove"
                                                    variant="border-filled"
                                                    onclick={handleRemoveFindingRow}
                                                    data-index={index}>
                                                </lightning-button-icon>
                                            </div>
                                        </div>
                                        <div class="slds-grid slds-gutters slds-wrap">
                                            <div class="slds-col slds-size_12-of-12 slds-medium-size_4-of-12 slds-m-bottom_x-small">
                                                <lightning-combobox
                                                    label="Finding Category"
                                                    options={findingCategoryOptions}
                                                    value={f.Finding_Category__c}
                                                    onchange={handleFindingFieldChange}
                                                    data-field="Finding_Category__c"
                                                    data-index={index}>
                                                </lightning-combobox>
                                            </div>
                                            <div class="slds-col slds-size_12-of-12 slds-medium-size_4-of-12 slds-m-bottom_x-small">
                                                <lightning-combobox
                                                    label="Severity"
                                                    options={severityOptions}
                                                    value={f.Severity__c}
                                                    onchange={handleFindingFieldChange}
                                                    data-field="Severity__c"
                                                    data-index={index}>
                                                </lightning-combobox>
                                            </div>
                                            <div class="slds-col slds-size_12-of-12 slds-medium-size_4-of-12 slds-m-bottom_x-small">
                                                <lightning-input
                                                    type="number"
                                                    formatter="currency"
                                                    step="0.01"
                                                    label="Statutory Fine ($)"
                                                    value={f.Statutory_Fine_Amount__c}
                                                    onchange={handleFindingFieldChange}
                                                    data-field="Statutory_Fine_Amount__c"
                                                    data-index={index}>
                                                </lightning-input>
                                            </div>
                                            <div class="slds-col slds-size_12-of-12 slds-medium-size_9-of-12 slds-m-bottom_x-small">
                                                <lightning-input
                                                    type="text"
                                                    label="Mandated Corrective Action Plan"
                                                    placeholder="Required remediation steps..."
                                                    value={f.Corrective_Action_Plan__c}
                                                    onchange={handleFindingFieldChange}
                                                    data-field="Corrective_Action_Plan__c"
                                                    data-index={index}>
                                                </lightning-input>
                                            </div>
                                            <div class="slds-col slds-size_12-of-12 slds-medium-size_3-of-12 slds-grid slds-grid_vertical-align-center slds-m-top_medium">
                                                <lightning-input
                                                    type="checkbox"
                                                    label="Resolved"
                                                    checked={f.Resolved__c}
                                                    onchange={handleFindingFieldChange}
                                                    data-field="Resolved__c"
                                                    data-index={index}>
                                                </lightning-input>
                                            </div>
                                        </div>
                                    </div>
                                </template>
                            </template>

                            <template lwc:else>
                                <div class="slds-p-around_medium slds-text-align_center text-muted">
                                    No citations added. Click "Add Finding" if deficiencies or violations were observed.
                                </div>
                            </template>
                        </div>
                    </div>
                    <footer class="slds-modal__footer">
                        <lightning-button label="Cancel" onclick={closeNewAuditModal} class="slds-m-right_small"></lightning-button>
                        <lightning-button
                            variant="brand"
                            label="Save Inspection Audit Scorecard"
                            icon-name="utility:save"
                            disabled={isSubmitDisabled}
                            onclick={submitNewAudit}>
                        </lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>
    </div>
</template>
