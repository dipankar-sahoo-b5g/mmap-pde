<template>
    <div class="slds-card slds-m-around_none slds-box_border mmap-main-wrapper">
        <!-- Spinner -->
        <template lwc:if={isOverallLoading}>
            <lightning-spinner alternative-text="Loading Traceability Intelligence..." size="medium"></lightning-spinner>
        </template>

        <!-- Executive Header -->
        <div class="mmap-header-banner slds-p-around_medium">
            <div class="slds-grid slds-grid_vertical-align-center slds-wrap">
                <div class="slds-col slds-size_1-of-1 slds-medium-size_8-of-12">
                    <div class="slds-media slds-media_center">
                        <div class="slds-media__figure">
                            <lightning-icon icon-name="custom:custom63" size="medium" variant="inverse"></lightning-icon>
                        </div>
                        <div class="slds-media__body">
                            <div class="slds-grid slds-grid_vertical-align-center slds-wrap">
                                <h1 class="mmap-title slds-m-right_small">Commonwealth Medical Marijuana Regulatory Platform</h1>
                                <span class="mmap-header-badge slds-m-top_xx-small">PA DOH Official Registry</span>
                            </div>
                            <p class="mmap-subtitle slds-m-top_xx-small">
                                Real-Time Seed-to-Sale Traceability, RFID Chain-of-Custody &amp; Statutory Compliance Explorer
                            </p>
                        </div>
                    </div>
                </div>
                <div class="slds-col slds-size_1-of-1 slds-medium-size_4-of-12 slds-text-align_right slds-m-top_small slds-medium-m-top_none mmap-header-actions">
                    <lightning-button
                        variant="neutral"
                        label="Refresh Data"
                        icon-name="utility:refresh"
                        onclick={handleRefresh}
                        class="slds-m-right_x-small">
                    </lightning-button>
                    <span class="mmap-header-badge">Metrc Sync: Active</span>
                </div>
            </div>
        </div>

        <div class="slds-p-around_medium">
            <!-- Program Live Metrics KPI Ribbon -->
            <div class="slds-m-bottom_large">
                <div class="slds-grid slds-grid_vertical-align-center slds-m-bottom_x-small">
                    <lightning-icon icon-name="standard:metrics" size="x-small" class="slds-m-right_xx-small"></lightning-icon>
                    <h2 class="slds-text-title_bold slds-text-color_weak">STATEWIDE PROGRAM AGGREGATE KPIS</h2>
                </div>
                <div class="mmap-kpi-grid">
                    <div class="mmap-kpi-card slds-p-around_small slds-text-align_center">
                        <div class="mmap-kpi-value">{metrics.facilities}</div>
                        <div class="mmap-kpi-label">Commercial Facilities</div>
                    </div>
                    <div class="mmap-kpi-card slds-p-around_small slds-text-align_center">
                        <div class="mmap-kpi-value">{metrics.licenses}</div>
                        <div class="mmap-kpi-label">Business Licenses</div>
                    </div>
                    <div class="mmap-kpi-card slds-p-around_small slds-text-align_center">
                        <div class="mmap-kpi-value">{metrics.patients}</div>
                        <div class="mmap-kpi-label">Registered Patients</div>
                    </div>
                    <div class="mmap-kpi-card slds-p-around_small slds-text-align_center">
                        <div class="mmap-kpi-value">{metrics.strains}</div>
                        <div class="mmap-kpi-label">Approved Strains</div>
                    </div>
                    <div class="mmap-kpi-card slds-p-around_small slds-text-align_center">
                        <div class="mmap-kpi-value">{metrics.batches}</div>
                        <div class="mmap-kpi-label">Plant Batches</div>
                    </div>
                    <div class="mmap-kpi-card slds-p-around_small slds-text-align_center">
                        <div class="mmap-kpi-value">{metrics.packages}</div>
                        <div class="mmap-kpi-label">Product Packages</div>
                    </div>
                    <div class="mmap-kpi-card slds-p-around_small slds-text-align_center">
                        <div class="mmap-kpi-value">{metrics.coas}</div>
                        <div class="mmap-kpi-label">Lab COA Tests</div>
                    </div>
                    <div class="mmap-kpi-card slds-p-around_small slds-text-align_center">
                        <div class="mmap-kpi-value">{metrics.transactions}</div>
                        <div class="mmap-kpi-label">Dispense Sales</div>
                    </div>
                </div>
            </div>

            <!-- 6-Stage Seed-to-Sale Pipeline Ribbon -->
            <div class="mmap-pipeline-container slds-p-around_small slds-m-bottom_large">
                <div class="slds-grid slds-grid_vertical-align-center slds-m-bottom_x-small">
                    <lightning-icon icon-name="standard:process" size="x-small" class="slds-m-right_xx-small"></lightning-icon>
                    <h2 class="slds-text-title_bold slds-text-color_weak">SEED-TO-SALE 6-STAGE REGULATORY PIPELINE</h2>
                </div>
                <div class="mmap-pipeline-flow">
                    <!-- Stage 1 -->
                    <div class="mmap-pipeline-card">
                        <div class="mmap-stage-number">Stage 1 • Genetics</div>
                        <div class="mmap-stage-name" title="Mother Plants &amp; Cultivars">Mother Plants &amp; Cultivars</div>
                        <div class="mmap-stage-count">{pipelineStageCounts.stage1} <span class="slds-text-body_small slds-text-color_weak">Strains</span></div>
                    </div>
                    <!-- Stage 2 -->
                    <div class="mmap-pipeline-card">
                        <div class="mmap-stage-number">Stage 2 • Cultivation</div>
                        <div class="mmap-stage-name" title="Veg &amp; Flowering Canopy">Veg &amp; Flowering Canopy</div>
                        <div class="mmap-stage-count">{pipelineStageCounts.stage2} <span class="slds-text-body_small slds-text-color_weak">Batches</span></div>
                    </div>
                    <!-- Stage 3 -->
                    <div class="mmap-pipeline-card">
                        <div class="mmap-stage-number">Stage 3 • Harvest</div>
                        <div class="mmap-stage-name" title="Drying &amp; Extraction">Drying &amp; Extraction</div>
                        <div class="mmap-stage-count">{pipelineStageCounts.stage3} <span class="slds-text-body_small slds-text-color_weak">Cured</span></div>
                    </div>
                    <!-- Stage 4 -->
                    <div class="mmap-pipeline-card">
                        <div class="mmap-stage-number">Stage 4 • Packaging</div>
                        <div class="mmap-stage-name" title="Serialized RFID Tagging">Serialized RFID Tagging</div>
                        <div class="mmap-stage-count">{pipelineStageCounts.stage4} <span class="slds-text-body_small slds-text-color_weak">Units</span></div>
                    </div>
                    <!-- Stage 5 -->
                    <div class="mmap-pipeline-card">
                        <div class="mmap-stage-number">Stage 5 • Lab Screening</div>
                        <div class="mmap-stage-name" title="Certificate of Analysis">Certificate of Analysis</div>
                        <div class="mmap-stage-count">{pipelineStageCounts.stage5} <span class="slds-text-body_small slds-text-color_weak">Certified</span></div>
                    </div>
                    <!-- Stage 6 -->
                    <div class="mmap-pipeline-card">
                        <div class="mmap-stage-number">Stage 6 • Point of Sale</div>
                        <div class="mmap-stage-name" title="Dispensary Checkout">Dispensary Checkout</div>
                        <div class="mmap-stage-count">{pipelineStageCounts.stage6} <span class="slds-text-body_small slds-text-color_weak">Dispensed</span></div>
                    </div>
                </div>
            </div>

            <!-- Traceability Search & Genealogy Explorer Workspace -->
            <div class="slds-grid slds-gutters slds-wrap">
                <!-- Left Column: Search & Inventory Chains List -->
                <div class="slds-col slds-size_1-of-1 slds-large-size_4-of-12 slds-m-bottom_medium">
                    <div class="slds-card slds-box_border slds-p-around_small">
                        <div class="slds-m-bottom_small">
                            <h3 class="slds-text-heading_small slds-text-title_bold">Serialized Inventory Units</h3>
                            <p class="slds-text-body_small slds-text-color_weak">Select any package to inspect full genealogy</p>
                        </div>

                        <!-- Filters -->
                        <div class="slds-m-bottom_small">
                            <lightning-input
                                type="search"
                                label="Search Inventory"
                                placeholder="Search RFID, Package, Batch, Patient..."
                                value={searchTerm}
                                onchange={handleSearchChange}
                                variant="label-hidden">
                            </lightning-input>
                        </div>
                        <div class="slds-grid slds-gutters slds-wrap slds-m-bottom_small">
                            <div class="slds-col slds-size_1-of-1 slds-small-size_1-of-2 slds-m-bottom_xx-small slds-small-m-bottom_none">
                                <lightning-combobox
                                    label="Lifecycle Stage"
                                    value={stageFilter}
                                    options={stageOptions}
                                    onchange={handleStageFilterChange}
                                    variant="label-hidden">
                                </lightning-combobox>
                            </div>
                            <div class="slds-col slds-size_1-of-1 slds-small-size_1-of-2">
                                <lightning-combobox
                                    label="Safety Status"
                                    value={safetyFilter}
                                    options={safetyOptions}
                                    onchange={handleSafetyFilterChange}
                                    variant="label-hidden">
                                </lightning-combobox>
                            </div>
                        </div>

                        <!-- Package List -->
                        <template lwc:if={hasFilteredChains}>
                            <div style="max-height: 650px; overflow-y: auto; padding-right: 4px;">
                                <template for:each={filteredChains} for:item="chain">
                                    <div
                                        key={chain.chainId}
                                        data-id={chain.chainId}
                                        class={chain.cardClass}
                                        onclick={handleSelectChainCard}>
                                        <div class="slds-grid slds-grid_vertical-align-center slds-grid_align-spread slds-m-bottom_xx-small">
                                            <span class="mmap-rfid-chip">{chain.packageRecord.rfidTag}</span>
                                            <lightning-badge label={chain.packageRecord.labSafetyStatus} variant={chain.badgeVariant}></lightning-badge>
                                        </div>
                                        <div class="slds-grid slds-grid_align-spread slds-m-top_xx-small">
                                            <div>
                                                <div class="slds-text-heading_small slds-truncate" title={chain.packageRecord.name}>
                                                    <strong>{chain.packageRecord.name}</strong>
                                                </div>
                                                <div class="slds-text-body_small slds-text-color_weak">
                                                    {chain.packageRecord.productType} • {chain.packageRecord.netWeight}g
                                                </div>
                                            </div>
                                            <div class="slds-text-align_right">
                                                <lightning-badge label={chain.packageRecord.status} variant={chain.statusBadgeVariant}></lightning-badge>
                                                <div class="slds-text-body_small slds-text-color_weak slds-m-top_xx-small">
                                                    {chain.lifecycleStage}
                                                </div>
                                            </div>
                                        </div>
                                        <div class="slds-m-top_x-small slds-text-body_small slds-text-color_weak slds-truncate">
                                            <lightning-icon icon-name="standard:location" size="xx-small" class="slds-m-right_xx-small"></lightning-icon>
                                            Custody: {chain.holdingFacility.name}
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </template>
                        <template lwc:else>
                            <div class="mmap-empty-state">
                                <lightning-icon icon-name="utility:search" size="medium"></lightning-icon>
                                <p class="slds-m-top_small">No packages match the filter criteria.</p>
                            </div>
                        </template>
                    </div>
                </div>

                <!-- Right Column: Interactive Lineage & Genealogy Explorer Tree -->
                <div class="slds-col slds-size_1-of-1 slds-large-size_8-of-12">
                    <template lwc:if={hasSelectedChain}>
                        <div class="mmap-genealogy-container slds-p-around_medium">
                            <!-- Selected Header Bar -->
                            <div class="slds-grid slds-grid_vertical-align-center slds-grid_align-spread slds-m-bottom_medium slds-p-bottom_small slds-border_bottom slds-wrap">
                                <div class="slds-col slds-size_1-of-1 slds-medium-size_8-of-12 slds-m-bottom_x-small slds-medium-m-bottom_none">
                                    <div class="slds-grid slds-grid_vertical-align-center slds-wrap">
                                        <h2 class="slds-text-heading_medium slds-m-right_small">
                                            <strong>{selectedChain.packageRecord.name}</strong>
                                        </h2>
                                        <span class="mmap-rfid-chip">{selectedChain.packageRecord.rfidTag}</span>
                                    </div>
                                    <p class="slds-text-body_small slds-text-color_weak slds-m-top_xx-small">
                                        Current Regulatory Stage: <strong>{selectedChain.lifecycleStage}</strong> • Custody: <strong>{selectedChain.holdingFacility.name}</strong>
                                    </p>
                                </div>
                                <div class="slds-col slds-size_1-of-1 slds-medium-size_4-of-12 slds-medium-text-align_right">
                                    <lightning-button
                                        label="View Package Record"
                                        icon-name="utility:new_window"
                                        data-id={selectedChain.packageRecord.id}
                                        onclick={handleNavigateToRecord}>
                                    </lightning-button>
                                </div>
                            </div>

                            <!-- Genealogy Tree: Step 1 Origin Cultivator Premise -->
                            <div class="mmap-tree-node">
                                <div class="mmap-node-header">
                                    <div class="slds-grid slds-grid_vertical-align-center">
                                        <lightning-icon icon-name="standard:account" size="small" class="slds-m-right_small"></lightning-icon>
                                        <div>
                                            <div class="mmap-node-title">1. Origin Cultivation Facility</div>
                                            <div class="slds-text-body_small slds-text-color_weak">Licensed Grower-Processor Premises</div>
                                        </div>
                                    </div>
                                    <span class="mmap-node-step-tag">Origin Point</span>
                                </div>
                                <div class="slds-grid slds-gutters slds-wrap">
                                    <div class="slds-col slds-size_1-of-1 slds-small-size_1-of-2 slds-medium-size_1-of-3 slds-m-bottom_x-small">
                                        <div class="mmap-data-label">Facility Name</div>
                                        <div class="mmap-data-val">
                                            <a class="mmap-record-link" data-id={selectedChain.cultivatorRecord.id} onclick={handleNavigateToRecord}>
                                                {selectedChain.cultivatorRecord.name}
                                            </a>
                                        </div>
                                    </div>
                                    <div class="slds-col slds-size_1-of-1 slds-small-size_1-of-2 slds-medium-size_1-of-3 slds-m-bottom_x-small">
                                        <div class="mmap-data-label">Premise Registry ID</div>
                                        <div class="mmap-data-val">{selectedChain.cultivatorRecord.premiseId}</div>
                                    </div>
                                    <div class="slds-col slds-size_1-of-1 slds-small-size_1-of-2 slds-medium-size_1-of-3 slds-m-bottom_x-small">
                                        <div class="mmap-data-label">Compliance Standing</div>
                                        <div class="mmap-data-val">
                                            <lightning-badge label="State Compliant" variant="success"></lightning-badge>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="mmap-connector-line"></div>

                            <!-- Genealogy Tree: Step 2 Genetic Cultivar Catalog -->
                            <div class="mmap-tree-node">
                                <div class="mmap-node-header">
                                    <div class="slds-grid slds-grid_vertical-align-center">
                                        <lightning-icon icon-name="custom:custom63" size="small" class="slds-m-right_small"></lightning-icon>
                                        <div>
                                            <div class="mmap-node-title">2. Cannabis Cultivar Genetics</div>
                                            <div class="slds-text-body_small slds-text-color_weak">State Registered Botanical Profile</div>
                                        </div>
                                    </div>
                                    <span class="mmap-node-step-tag">Genetics</span>
                                </div>
                                <div class="slds-grid slds-gutters slds-wrap">
                                    <div class="slds-col slds-size_1-of-1 slds-small-size_1-of-2 slds-medium-size_1-of-4 slds-m-bottom_x-small">
                                        <div class="mmap-data-label">Cultivar Name</div>
                                        <div class="mmap-data-val">
                                            <a class="mmap-record-link" data-id={selectedChain.strainRecord.id} onclick={handleNavigateToRecord}>
                                                {selectedChain.strainRecord.name}
                                            </a>
                                        </div>
                                    </div>
                                    <div class="slds-col slds-size_1-of-1 slds-small-size_1-of-2 slds-medium-size_1-of-4 slds-m-bottom_x-small">
                                        <div class="mmap-data-label">Botanical Class</div>
                                        <div class="mmap-data-val">{selectedChain.strainRecord.classification}</div>
                                    </div>
                                    <div class="slds-col slds-size_1-of-1 slds-small-size_1-of-2 slds-medium-size_1-of-4 slds-m-bottom_x-small">
                                        <div class="mmap-data-label">Target THC Profile</div>
                                        <div class="mmap-data-val">{selectedChain.strainRecord.targetThc}%</div>
                                    </div>
                                    <div class="slds-col slds-size_1-of-1 slds-small-size_1-of-2 slds-medium-size_1-of-4 slds-m-bottom_x-small">
                                        <div class="mmap-data-label">Target CBD Profile</div>
                                        <div class="mmap-data-val">{selectedChain.strainRecord.targetCbd}%</div>
                                    </div>
                                </div>
                            </div>

                            <div class="mmap-connector-line"></div>

                            <!-- Genealogy Tree: Step 3 Plant Cultivation Batch -->
                            <div class="mmap-tree-node">
                                <div class="mmap-node-header">
                                    <div class="slds-grid slds-grid_vertical-align-center">
                                        <lightning-icon icon-name="standard:plant_batch" size="small" class="slds-m-right_small"></lightning-icon>
                                        <div>
                                            <div class="mmap-node-title">3. Cultivation Plant Batch</div>
                                            <div class="slds-text-body_small slds-text-color_weak">Canopy Growth, Room Tracking &amp; Harvest</div>
                                        </div>
                                    </div>
                                    <span class="mmap-node-step-tag">Cultivation</span>
                                </div>
                                <div class="slds-grid slds-gutters slds-wrap">
                                    <div class="slds-col slds-size_1-of-1 slds-small-size_1-of-2 slds-medium-size_1-of-4 slds-m-bottom_x-small">
                                        <div class="mmap-data-label">Batch ID</div>
                                        <div class="mmap-data-val">
                                            <a class="mmap-record-link" data-id={selectedChain.batchRecord.id} onclick={handleNavigateToRecord}>
                                                {selectedChain.batchRecord.name}
                                            </a>
                                        </div>
                                    </div>
                                    <div class="slds-col slds-size_1-of-1 slds-small-size_1-of-2 slds-medium-size_1-of-4 slds-m-bottom_x-small">
                                        <div class="mmap-data-label">Growth Stage</div>
                                        <div class="mmap-data-val">{selectedChain.batchRecord.growthStage}</div>
                                    </div>
                                    <div class="slds-col slds-size_1-of-1 slds-small-size_1-of-2 slds-medium-size_1-of-4 slds-m-bottom_x-small">
                                        <div class="mmap-data-label">Planted Date</div>
                                        <div class="mmap-data-val">{selectedChain.batchRecord.plantedDate}</div>
                                    </div>
                                    <div class="slds-col slds-size_1-of-1 slds-small-size_1-of-2 slds-medium-size_1-of-4 slds-m-bottom_x-small">
                                        <div class="mmap-data-label">Harvest Date</div>
                                        <div class="mmap-data-val">{selectedChain.batchRecord.harvestDate}</div>
                                    </div>
                                </div>
                                <div class="slds-grid slds-gutters slds-wrap slds-m-top_small">
                                    <div class="slds-col slds-size_1-of-1 slds-small-size_1-of-2 slds-medium-size_1-of-3 slds-m-bottom_x-small">
                                        <div class="mmap-data-label">Facility Room Location</div>
                                        <div class="mmap-data-val">{selectedChain.batchRecord.roomLocation}</div>
                                    </div>
                                    <div class="slds-col slds-size_1-of-1 slds-small-size_1-of-2 slds-medium-size_1-of-3 slds-m-bottom_x-small">
                                        <div class="mmap-data-label">Wet Biomass Harvest</div>
                                        <div class="mmap-data-val">{selectedChain.batchRecord.wetWeight} Grams</div>
                                    </div>
                                    <div class="slds-col slds-size_1-of-1 slds-small-size_1-of-2 slds-medium-size_1-of-3 slds-m-bottom_x-small">
                                        <div class="mmap-data-label">Dry Cured Weight</div>
                                        <div class="mmap-data-val">{selectedChain.batchRecord.dryWeight} Grams</div>
                                    </div>
                                </div>
                            </div>

                            <div class="mmap-connector-line"></div>

                            <!-- Genealogy Tree: Step 4 Serialized Product Package -->
                            <div class="mmap-tree-node">
                                <div class="mmap-node-header">
                                    <div class="slds-grid slds-grid_vertical-align-center">
                                        <lightning-icon icon-name="standard:inventory" size="small" class="slds-m-right_small"></lightning-icon>
                                        <div>
                                            <div class="mmap-node-title">4. Serialized RFID Product Package</div>
                                            <div class="slds-text-body_small slds-text-color_weak">Metrc Compliant Serialization &amp; Custody</div>
                                        </div>
                                    </div>
                                    <span class="mmap-node-step-tag">Packaging</span>
                                </div>
                                <div class="slds-grid slds-gutters slds-wrap">
                                    <div class="slds-col slds-size_1-of-1 slds-small-size_1-of-2 slds-medium-size_1-of-4 slds-m-bottom_x-small">
                                        <div class="mmap-data-label">Package Number</div>
                                        <div class="mmap-data-val">
                                            <a class="mmap-record-link" data-id={selectedChain.packageRecord.id} onclick={handleNavigateToRecord}>
                                                {selectedChain.packageRecord.name}
                                            </a>
                                        </div>
                                    </div>
                                    <div class="slds-col slds-size_1-of-1 slds-small-size_1-of-2 slds-medium-size_1-of-4 slds-m-bottom_x-small">
                                        <div class="mmap-data-label">State RFID Tag (24-Char)</div>
                                        <div class="mmap-data-val">
                                            <span class="mmap-rfid-chip">{selectedChain.packageRecord.rfidTag}</span>
                                        </div>
                                    </div>
                                    <div class="slds-col slds-size_1-of-1 slds-small-size_1-of-2 slds-medium-size_1-of-4 slds-m-bottom_x-small">
                                        <div class="mmap-data-label">Product Form</div>
                                        <div class="mmap-data-val">{selectedChain.packageRecord.productType}</div>
                                    </div>
                                    <div class="slds-col slds-size_1-of-1 slds-small-size_1-of-2 slds-medium-size_1-of-4 slds-m-bottom_x-small">
                                        <div class="mmap-data-label">Net Weight / Price</div>
                                        <div class="mmap-data-val">{selectedChain.packageRecord.netWeight}g • ${selectedChain.packageRecord.unitPrice}</div>
                                    </div>
                                </div>
                                <div class="slds-grid slds-gutters slds-wrap slds-m-top_small">
                                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-m-bottom_x-small">
                                        <div class="mmap-data-label">Holding Facility Custody</div>
                                        <div class="mmap-data-val">
                                            <a class="mmap-record-link" data-id={selectedChain.holdingFacility.id} onclick={handleNavigateToRecord}>
                                                {selectedChain.holdingFacility.name}
                                            </a>
                                            <span class="slds-text-body_small slds-text-color_weak slds-m-left_x-small">({selectedChain.holdingFacility.type})</span>
                                        </div>
                                    </div>
                                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-m-bottom_x-small">
                                        <div class="mmap-data-label">Operational Package Status</div>
                                        <div class="mmap-data-val">
                                            <lightning-badge label={selectedChain.packageRecord.status} variant="default"></lightning-badge>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="mmap-connector-line"></div>

                            <!-- Genealogy Tree: Step 5 Certificate of Analysis (COA) Lab Screening -->
                            <div class="mmap-tree-node">
                                <div class="mmap-node-header">
                                    <div class="slds-grid slds-grid_vertical-align-center">
                                        <lightning-icon icon-name="standard:service_report" size="small" class="slds-m-right_small"></lightning-icon>
                                        <div>
                                            <div class="mmap-node-title">5. State-Certified Laboratory COA</div>
                                            <div class="slds-text-body_small slds-text-color_weak">Statutory 4-Point Chemical Safety Panel</div>
                                        </div>
                                    </div>
                                    <span class="mmap-node-step-tag">Safety Screening</span>
                                </div>
                                <template lwc:if={selectedChain.hasLabTest}>
                                    <div class="slds-grid slds-gutters slds-wrap">
                                        <div class="slds-col slds-size_1-of-1 slds-small-size_1-of-2 slds-medium-size_1-of-4 slds-m-bottom_x-small">
                                            <div class="mmap-data-label">COA Number</div>
                                            <div class="mmap-data-val">
                                                <a class="mmap-record-link" data-id={selectedChain.latestLabTest.id} onclick={handleNavigateToRecord}>
                                                    {selectedChain.latestLabTest.name}
                                                </a>
                                            </div>
                                        </div>
                                        <div class="slds-col slds-size_1-of-1 slds-small-size_1-of-2 slds-medium-size_1-of-4 slds-m-bottom_x-small">
                                            <div class="mmap-data-label">Testing Laboratory</div>
                                            <div class="mmap-data-val">{selectedChain.latestLabTest.labName}</div>
                                        </div>
                                        <div class="slds-col slds-size_1-of-1 slds-small-size_1-of-2 slds-medium-size_1-of-4 slds-m-bottom_x-small">
                                            <div class="mmap-data-label">Screen Date</div>
                                            <div class="mmap-data-val">{selectedChain.latestLabTest.testDate}</div>
                                        </div>
                                        <div class="slds-col slds-size_1-of-1 slds-small-size_1-of-2 slds-medium-size_1-of-4 slds-m-bottom_x-small">
                                            <div class="mmap-data-label">Overall Safety Status</div>
                                            <div class="mmap-data-val">
                                                <lightning-badge label={selectedChain.latestLabTest.status} variant="success"></lightning-badge>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="slds-grid slds-gutters slds-wrap slds-m-top_small">
                                        <div class="slds-col slds-size_1-of-1 slds-small-size_1-of-2 slds-medium-size_1-of-4 slds-m-bottom_x-small">
                                            <div class="mmap-data-label">Verified THC Potency</div>
                                            <div class="mmap-data-val">{selectedChain.latestLabTest.thcPotency}%</div>
                                        </div>
                                        <div class="slds-col slds-size_1-of-1 slds-small-size_1-of-2 slds-medium-size_1-of-4 slds-m-bottom_x-small">
                                            <div class="mmap-data-label">Verified CBD Potency</div>
                                            <div class="mmap-data-val">{selectedChain.latestLabTest.cbdPotency}%</div>
                                        </div>
                                        <div class="slds-col slds-size_1-of-1 slds-medium-size_2-of-4 slds-m-bottom_x-small">
                                            <div class="mmap-data-label">Chemical Safety Screens</div>
                                            <div class="slds-m-top_xx-small">
                                                <span class="slds-badge slds-theme_success slds-m-right_xx-small">Pesticides: Pass</span>
                                                <span class="slds-badge slds-theme_success slds-m-right_xx-small">Heavy Metals: Pass</span>
                                                <span class="slds-badge slds-theme_success slds-m-right_xx-small">Mycotoxins: Pass</span>
                                                <span class="slds-badge slds-theme_success">Solvents: Pass</span>
                                            </div>
                                        </div>
                                    </div>
                                </template>
                                <template lwc:else>
                                    <div class="slds-p-around_small slds-theme_shade slds-border_around slds-radius_medium slds-text-align_center">
                                        <p class="slds-text-body_small slds-text-color_weak">
                                            <lightning-icon icon-name="utility:warning" size="x-small" class="slds-m-right_xx-small"></lightning-icon>
                                            Awaiting mandatory laboratory test panel. Package cannot be dispensed until safety status is Passed.
                                        </p>
                                    </div>
                                </template>
                            </div>

                            <div class="mmap-connector-line"></div>

                            <!-- Genealogy Tree: Step 6 Dispensary POS & Patient Dispense -->
                            <div class="mmap-tree-node">
                                <div class="mmap-node-header">
                                    <div class="slds-grid slds-grid_vertical-align-center">
                                        <lightning-icon icon-name="standard:orders" size="small" class="slds-m-right_small"></lightning-icon>
                                        <div>
                                            <div class="mmap-node-title">6. Dispensary Point-of-Sale Checkout</div>
                                            <div class="slds-text-body_small slds-text-color_weak">Statutory 30-Day Limit Validation &amp; Dispense</div>
                                        </div>
                                    </div>
                                    <span class="mmap-node-step-tag">Final Sale</span>
                                </div>
                                <template lwc:if={selectedChain.hasTransaction}>
                                    <div class="slds-grid slds-gutters slds-wrap">
                                        <div class="slds-col slds-size_1-of-1 slds-small-size_1-of-2 slds-medium-size_1-of-4 slds-m-bottom_x-small">
                                            <div class="mmap-data-label">Receipt Number</div>
                                            <div class="mmap-data-val">
                                                <a class="mmap-record-link" data-id={selectedChain.latestTransaction.id} onclick={handleNavigateToRecord}>
                                                    {selectedChain.latestTransaction.name}
                                                </a>
                                            </div>
                                        </div>
                                        <div class="slds-col slds-size_1-of-1 slds-small-size_1-of-2 slds-medium-size_1-of-4 slds-m-bottom_x-small">
                                            <div class="mmap-data-label">Dispensary Facility</div>
                                            <div class="mmap-data-val">{selectedChain.latestTransaction.dispensaryName}</div>
                                        </div>
                                        <div class="slds-col slds-size_1-of-1 slds-small-size_1-of-2 slds-medium-size_1-of-4 slds-m-bottom_x-small">
                                            <div class="mmap-data-label">Grams Dispensed</div>
                                            <div class="mmap-data-val">{selectedChain.latestTransaction.gramsDispensed} Grams</div>
                                        </div>
                                        <div class="slds-col slds-size_1-of-1 slds-small-size_1-of-2 slds-medium-size_1-of-4 slds-m-bottom_x-small">
                                            <div class="mmap-data-label">Amount Paid</div>
                                            <div class="mmap-data-val">${selectedChain.latestTransaction.totalAmount}</div>
                                        </div>
                                    </div>
                                    <div class="slds-grid slds-gutters slds-wrap slds-m-top_small">
                                        <div class="slds-col slds-size_1-of-1 slds-small-size_1-of-3 slds-m-bottom_x-small">
                                            <div class="mmap-data-label">Patient Name</div>
                                            <div class="mmap-data-val">{selectedChain.latestTransaction.patientName}</div>
                                        </div>
                                        <div class="slds-col slds-size_1-of-1 slds-small-size_1-of-3 slds-m-bottom_x-small">
                                            <div class="mmap-data-label">Registration ID</div>
                                            <div class="mmap-data-val">
                                                <a class="mmap-record-link" data-id={selectedChain.latestTransaction.patientRegId} onclick={handleNavigateToRecord}>
                                                    {selectedChain.latestTransaction.patientRegNumber}
                                                </a>
                                            </div>
                                        </div>
                                        <div class="slds-col slds-size_1-of-1 slds-small-size_1-of-3 slds-m-bottom_x-small">
                                            <div class="mmap-data-label">Patient Card Barcode</div>
                                            <div class="mmap-data-val">
                                                <code>{selectedChain.latestTransaction.patientBarcode}</code>
                                            </div>
                                        </div>
                                    </div>
                                </template>
                                <template lwc:else>
                                    <div class="slds-p-around_small slds-theme_shade slds-border_around slds-radius_medium slds-text-align_center">
                                        <p class="slds-text-body_small slds-text-color_weak">
                                            Package currently held in inventory. Not yet dispensed to a certified medical marijuana patient.
                                        </p>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </template>
                    <template lwc:else>
                        <div class="mmap-empty-state slds-card slds-box_border slds-p-around_large">
                            <lightning-icon icon-name="utility:flow" size="large"></lightning-icon>
                            <h3 class="slds-text-heading_medium slds-m-top_medium">Select an Inventory Package</h3>
                            <p class="slds-text-body_regular slds-text-color_weak slds-m-top_x-small">
                                Click on any serialized package from the list on the left to visualize its end-to-end seed-to-sale genealogy tree.
                            </p>
                        </div>
                    </template>
                </div>
            </div>
        </div>
    </div>
</template>
