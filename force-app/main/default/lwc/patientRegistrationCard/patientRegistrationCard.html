<template>
    <div class="slds-card slds-p-around_medium mmap-card-wrapper">
        <!-- Top Regulatory Navigation & Actions Bar -->
        <div class="slds-page-header slds-m-bottom_medium slds-box slds-theme_default">
            <div class="slds-page-header__row slds-grid_vertical-align-center">
                <div class="slds-page-header__col-title">
                    <div class="slds-media slds-no-space slds-grow">
                        <div class="slds-media__figure">
                            <lightning-icon icon-name="custom:custom86" size="medium" alternative-text="Registry Card"></lightning-icon>
                        </div>
                        <div class="slds-media__body">
                            <h1 class="slds-page-header__title slds-truncate" title="Patient Digital Registry">
                                Commonwealth Medical Marijuana Digital Registry &amp; Card
                            </h1>
                            <p class="slds-page-header__name-meta">
                                Official Pennsylvania Department of Health • 30-Day Quota Enforcement &amp; Physician Recommendations
                            </p>
                        </div>
                    </div>
                </div>
                <div class="slds-page-header__col-actions">
                    <div class="slds-grid slds-grid_vertical-align-center slds-gutters_small">
                        <!-- Patient Switcher -->
                        <div class="slds-col" style="min-width: 220px;">
                            <lightning-combobox
                                name="patientSelect"
                                label="Select Patient"
                                variant="label-hidden"
                                value={selectedPatientId}
                                options={patientOptions}
                                placeholder="Choose Patient..."
                                onchange={handlePatientChange}>
                            </lightning-combobox>
                        </div>
                        <div class="slds-col">
                            <lightning-button-group>
                                <lightning-button
                                    label="Refresh"
                                    icon-name="utility:refresh"
                                    onclick={handleRefresh}>
                                </lightning-button>
                                <lightning-button
                                    label="New Recommendation"
                                    icon-name="utility:add"
                                    variant="brand"
                                    onclick={openNewCertModal}>
                                </lightning-button>
                            </lightning-button-group>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <template lwc:if={isLoading}>
            <div class="slds-is-relative slds-p-around_large slds-text-align_center">
                <lightning-spinner alternative-text="Loading Patient Data..." size="medium"></lightning-spinner>
                <p class="slds-m-top_medium slds-text-heading_small slds-text-color_weak">Synchronizing patient registration and purchase limit ledger...</p>
            </div>
        </template>

        <template lwc:else>
            <!-- Main Grid: Digital ID Card on Left, Quota & Clinical Data on Right -->
            <div class="slds-grid slds-wrap slds-gutters_medium slds-m-bottom_large">
                
                <!-- Left: Physical Digital Card Representation -->
                <div class="slds-col slds-size_1-wrap slds-medium-size_6-of-12 slds-large-size_5-of-12 slds-m-bottom_medium">
                    <div class="digital-id-card">
                        <!-- Card Header -->
                        <div class="card-header-banner slds-grid slds-grid_vertical-align-center slds-grid_align-spread">
                            <div class="slds-grid slds-grid_vertical-align-center">
                                <div class="state-badge-seal slds-m-right_small">
                                    <span>PA</span>
                                </div>
                                <div>
                                    <div class="gold-accent-text slds-text-title_bold">Commonwealth of Pennsylvania</div>
                                    <div class="card-title-main">DEPARTMENT OF HEALTH</div>
                                    <div class="slds-text-body_small" style="color: #cbd5e1; font-weight: 500;">
                                        Medical Marijuana Identification Card
                                    </div>
                                </div>
                            </div>
                            <div>
                                <template lwc:if={cardData.isActive}>
                                    <span class="slds-badge slds-theme_success" style="font-weight: 800; padding: 4px 10px;">ACTIVE</span>
                                </template>
                                <template lwc:else>
                                    <span class="slds-badge slds-theme_error" style="font-weight: 800; padding: 4px 10px;">EXPIRED</span>
                                </template>
                            </div>
                        </div>

                        <!-- Card Body -->
                        <div class="card-body-content">
                            <!-- Patient Name & ID -->
                            <div class="slds-grid slds-wrap slds-m-bottom_medium">
                                <div class="slds-col slds-size_7-of-12">
                                    <div class="label-micro">Registered Patient Name</div>
                                    <div class="value-highlight">{cardData.patientName}</div>
                                </div>
                                <div class="slds-col slds-size_5-of-12">
                                    <div class="label-micro">Registration Number</div>
                                    <div class="value-highlight" style="color: #ffd700;">{cardData.registrationNumber}</div>
                                </div>
                            </div>

                            <!-- Dates & State DL -->
                            <div class="slds-grid slds-wrap slds-m-bottom_medium">
                                <div class="slds-col slds-size_4-of-12">
                                    <div class="label-micro">Issue Date</div>
                                    <div class="value-subtext">{cardData.issueDate}</div>
                                </div>
                                <div class="slds-col slds-size_4-of-12">
                                    <div class="label-micro">Expires</div>
                                    <div class="value-subtext" style="color: #fca5a5;">{cardData.expirationDate}</div>
                                </div>
                                <div class="slds-col slds-size_4-of-12">
                                    <div class="label-micro">State ID / DL</div>
                                    <div class="value-subtext">{cardData.stateIdNumber}</div>
                                </div>
                            </div>

                            <!-- Doctor & Qualifying Condition -->
                            <div class="slds-grid slds-wrap slds-m-bottom_medium" style="border-top: 1px solid rgba(255,255,255,0.15); padding-top: 0.75rem;">
                                <div class="slds-col slds-size_7-of-12">
                                    <div class="label-micro">Certifying Physician</div>
                                    <div class="value-subtext">{cardData.physicianName}</div>
                                    <div class="label-micro" style="font-size: 0.6rem; color: #94a3b8;">License: {cardData.physicianLicense}</div>
                                </div>
                                <div class="slds-col slds-size_5-of-12">
                                    <div class="label-micro">Qualifying Condition</div>
                                    <div class="value-subtext" style="color: #6ee7b7;">{cardData.qualifyingCondition}</div>
                                </div>
                            </div>

                            <!-- Simulated Barcode Component -->
                            <div class="barcode-box slds-m-top_small">
                                <div class="barcode-stripes-container">
                                    <div class="b-bar w-2"></div>
                                    <div class="b-bar w-1"></div>
                                    <div class="b-bar w-3"></div>
                                    <div class="b-bar w-1"></div>
                                    <div class="b-bar w-4"></div>
                                    <div class="b-bar w-2"></div>
                                    <div class="b-bar w-1"></div>
                                    <div class="b-bar w-3"></div>
                                    <div class="b-bar w-2"></div>
                                    <div class="b-bar w-1"></div>
                                    <div class="b-bar w-4"></div>
                                    <div class="b-bar w-3"></div>
                                    <div class="b-bar w-1"></div>
                                    <div class="b-bar w-2"></div>
                                    <div class="b-bar w-3"></div>
                                    <div class="b-bar w-1"></div>
                                    <div class="b-bar w-2"></div>
                                    <div class="b-bar w-4"></div>
                                    <div class="b-bar w-1"></div>
                                    <div class="b-bar w-3"></div>
                                    <div class="b-bar w-2"></div>
                                    <div class="b-bar w-1"></div>
                                    <div class="b-bar w-4"></div>
                                    <div class="b-bar w-2"></div>
                                    <div class="b-bar w-3"></div>
                                    <div class="b-bar w-1"></div>
                                </div>
                                <div class="barcode-text">{cardData.barcodeString}</div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Right: Purchase Quota Scorecard & Clinical Dose -->
                <div class="slds-col slds-size_1-wrap slds-medium-size_6-of-12 slds-large-size_7-of-12">
                    
                    <!-- 30-Day Quota Scorecard -->
                    <div class="slds-card slds-p-around_medium slds-m-bottom_medium slds-box slds-theme_default">
                        <div class="slds-grid slds-grid_vertical-align-center slds-m-bottom_small">
                            <lightning-icon icon-name="standard:metric" size="small" class="slds-m-right_x-small"></lightning-icon>
                            <h2 class="slds-text-heading_small slds-text-title_bold">
                                Live 30-Day Statutory Purchase Limit Scorecard
                            </h2>
                        </div>
                        <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_medium">
                            Enforced per 35 P.S. § 10231.303. Dispensary sales deduct automatically from this rolling window.
                        </p>

                        <div class="slds-grid slds-wrap slds-gutters_small slds-m-bottom_medium">
                            <div class="slds-col slds-size_1-of-3">
                                <div class="score-tile tile-total">
                                    <div class="slds-text-title_caps slds-text-color_weak">30-Day Quota</div>
                                    <div class="slds-text-heading_medium slds-m-top_xx-small" style="font-weight: 800; color: #1e3a8a;">
                                        {cardData.totalQuotaGrams} <span style="font-size: 0.9rem; font-weight: normal;">g</span>
                                    </div>
                                    <div class="slds-text-body_small slds-text-color_weak">Statutory Cap</div>
                                </div>
                            </div>
                            <div class="slds-col slds-size_1-of-3">
                                <div class="score-tile tile-used">
                                    <div class="slds-text-title_caps slds-text-color_weak">Grams Dispensed</div>
                                    <div class="slds-text-heading_medium slds-m-top_xx-small" style="font-weight: 800; color: #b45309;">
                                        {cardData.gramsUsed} <span style="font-size: 0.9rem; font-weight: normal;">g</span>
                                    </div>
                                    <div class="slds-text-body_small slds-text-color_weak">{cardData.percentUsed}% consumed</div>
                                </div>
                            </div>
                            <div class="slds-col slds-size_1-of-3">
                                <div class="score-tile tile-remaining">
                                    <div class="slds-text-title_caps slds-text-color_weak">Grams Remaining</div>
                                    <div class="slds-text-heading_medium slds-m-top_xx-small" style="font-weight: 800; color: #065f46;">
                                        {cardData.gramsRemaining} <span style="font-size: 0.9rem; font-weight: normal;">g</span>
                                    </div>
                                    <div class="slds-text-body_small" style="color: #059669; font-weight: 600;">Available Now</div>
                                </div>
                            </div>
                        </div>

                        <!-- Progress Bar Track -->
                        <div>
                            <div class="slds-grid slds-grid_align-spread slds-text-body_small slds-m-bottom_xx-small">
                                <span class="slds-text-color_weak">Quota Utilization:</span>
                                <span class="slds-text-title_bold">{cardData.gramsUsed}g of {cardData.totalQuotaGrams}g ({cardData.percentUsed}%)</span>
                            </div>
                            <div class="progress-track">
                                <div class={progressFillClass} style={progressFillStyle}></div>
                            </div>
                        </div>
                    </div>

                    <!-- Clinical Recommendation Summary Box -->
                    <div class="slds-card slds-p-around_medium slds-box slds-theme_default">
                        <div class="slds-grid slds-grid_vertical-align-center slds-m-bottom_small">
                            <lightning-icon icon-name="standard:service_appointment" size="small" class="slds-m-right_x-small"></lightning-icon>
                            <h2 class="slds-text-heading_small slds-text-title_bold">
                                Active Clinical Recommendation &amp; Doctor Signature
                            </h2>
                        </div>
                        <template lwc:if={cardData.hasCertification}>
                            <div class="slds-grid slds-wrap slds-gutters_small">
                                <div class="slds-col slds-size_6-of-12 slds-m-bottom_small">
                                    <span class="slds-text-color_weak slds-text-body_small">Certification Number:</span>
                                    <div class="slds-text-title_bold slds-text-color_success">{cardData.certificationNumber}</div>
                                </div>
                                <div class="slds-col slds-size_6-of-12 slds-m-bottom_small">
                                    <span class="slds-text-color_weak slds-text-body_small">Recommended Daily Dose:</span>
                                    <div class="slds-text-title_bold">{cardData.recommendedDailyDose} grams / day</div>
                                </div>
                                <div class="slds-col slds-size_12-of-12 slds-m-bottom_small">
                                    <span class="slds-text-color_weak slds-text-body_small">Doctor Digital Signature Timestamp:</span>
                                    <div class="slds-text-title_bold" style="font-family: monospace;">
                                        {cardData.digitalSignatureTimestamp} (Cryptographically Timestamped)
                                    </div>
                                </div>
                                <template lwc:if={cardData.certificationNotes}>
                                    <div class="slds-col slds-size_12-of-12">
                                        <span class="slds-text-color_weak slds-text-body_small">Clinical Diagnosis Notes:</span>
                                        <div class="slds-box slds-theme_shade slds-m-top_xx-small slds-p-around_x-small slds-text-body_small">
                                            {cardData.certificationNotes}
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </template>
                        <template lwc:else>
                            <div class="slds-notify slds-notify_alert slds-alert_warning" role="alert">
                                <span>No formal digital Physician Certification on file for this patient. Click "New Recommendation" above to issue one.</span>
                            </div>
                        </template>
                    </div>

                </div>
            </div>

            <!-- Recent Certifications Audit Log Table -->
            <div class="slds-card slds-box slds-theme_default slds-p-around_medium">
                <div class="slds-grid slds-grid_vertical-align-center slds-grid_align-spread slds-m-bottom_small">
                    <div class="slds-grid slds-grid_vertical-align-center">
                        <lightning-icon icon-name="custom:custom18" size="small" class="slds-m-right_x-small"></lightning-icon>
                        <h2 class="slds-text-heading_small slds-text-title_bold">
                            Recent Physician Certifications Registry Log
                        </h2>
                    </div>
                    <span class="slds-badge slds-badge_lightest">{certificationsCount} Record(s)</span>
                </div>

                <div class="slds-table--header-fixed_container" style="max-height: 280px; overflow-y: auto;">
                    <table class="slds-table slds-table_bordered slds-table_cell-buffer slds-table_striped">
                        <thead>
                            <tr class="slds-line-height_reset">
                                <th scope="col"><div class="slds-truncate" title="Cert #">Certification #</div></th>
                                <th scope="col"><div class="slds-truncate" title="Patient">Patient</div></th>
                                <th scope="col"><div class="slds-truncate" title="Doctor">Certifying Doctor</div></th>
                                <th scope="col"><div class="slds-truncate" title="Condition">Condition (ICD-10)</div></th>
                                <th scope="col"><div class="slds-truncate" title="Daily Dose">Daily Dose</div></th>
                                <th scope="col"><div class="slds-truncate" title="Issue Date">Issue Date</div></th>
                                <th scope="col"><div class="slds-truncate" title="Expiration">Expiration</div></th>
                                <th scope="col"><div class="slds-truncate" title="Status">Status</div></th>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={certifications} for:item="c">
                                <tr key={c.Id}>
                                    <td><div class="slds-truncate slds-text-title_bold">{c.Name}</div></td>
                                    <td><div class="slds-truncate">{c.Patient__r.Name}</div></td>
                                    <td><div class="slds-truncate">{c.Certifying_Physician__r.Name}</div></td>
                                    <td><div class="slds-truncate">{c.Qualifying_Condition_ICD10__c}</div></td>
                                    <td><div class="slds-truncate">{c.Recommended_Daily_Dose_Grams__c} g</div></td>
                                    <td><div class="slds-truncate">{c.Issue_Date__c}</div></td>
                                    <td><div class="slds-truncate">{c.Expiration_Date__c}</div></td>
                                    <td>
                                        <span class={c.statusBadgeClass}>{c.Status__c}</span>
                                    </td>
                                </tr>
                            </template>
                            <template lwc:if={noCertifications}>
                                <tr>
                                    <td colspan="8" class="slds-text-align_center slds-p-around_medium slds-text-color_weak">
                                        No physician certifications recorded yet in this environment.
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </div>
        </template>

        <!-- New Physician Certification Modal -->
        <template lwc:if={isModalOpen}>
            <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="modal-heading-01" class="slds-modal slds-fade-in-open slds-modal_medium">
                <div class="slds-modal__container">
                    <!-- Modal Header -->
                    <header class="slds-modal__header" style="background-color: #0B5C43; color: white;">
                        <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={closeNewCertModal}>
                            <lightning-icon icon-name="utility:close" alternative-text="close" size="small"></lightning-icon>
                        </button>
                        <h2 id="modal-heading-01" class="slds-modal__title slds-hyphenate" style="font-weight: 800;">
                            Submit Official Physician Medical Recommendation
                        </h2>
                        <p class="slds-m-top_x-small" style="color: #a7f3d0; font-size: 0.85rem;">
                            Statutory Recommendation under 35 P.S. § 10231.403 (Valid up to 12 Months)
                        </p>
                    </header>

                    <!-- Modal Body -->
                    <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
                        <template lwc:if={isSubmitting}>
                            <lightning-spinner alternative-text="Submitting Certification..." size="medium"></lightning-spinner>
                        </template>

                        <div class="slds-form slds-form_stacked">
                            <div class="slds-grid slds-wrap slds-gutters_small">
                                <div class="slds-col slds-size_1-of-1 slds-medium-size_6-of-12 slds-m-bottom_small">
                                    <lightning-combobox
                                        name="modalPatient"
                                        label="Registered Patient"
                                        required
                                        value={formPatientId}
                                        options={patientOptions}
                                        placeholder="Select patient..."
                                        onchange={handleFormChange}>
                                    </lightning-combobox>
                                </div>
                                <div class="slds-col slds-size_1-of-1 slds-medium-size_6-of-12 slds-m-bottom_small">
                                    <lightning-combobox
                                        name="modalPhysician"
                                        label="Certifying Physician"
                                        required
                                        value={formPhysicianId}
                                        options={physicianOptions}
                                        placeholder="Select doctor..."
                                        onchange={handleFormChange}>
                                    </lightning-combobox>
                                </div>
                            </div>

                            <div class="slds-grid slds-wrap slds-gutters_small">
                                <div class="slds-col slds-size_1-of-1 slds-medium-size_6-of-12 slds-m-bottom_small">
                                    <lightning-combobox
                                        name="modalCondition"
                                        label="Qualifying Medical Condition (ICD-10)"
                                        required
                                        value={formCondition}
                                        options={conditionOptions}
                                        placeholder="Select diagnosis..."
                                        onchange={handleFormChange}>
                                    </lightning-combobox>
                                </div>
                                <div class="slds-col slds-size_1-of-1 slds-medium-size_6-of-12 slds-m-bottom_small">
                                    <lightning-input
                                        type="number"
                                        name="modalDailyDose"
                                        label="Recommended Daily Dose (Grams)"
                                        step="0.1"
                                        min="0.1"
                                        max="20"
                                        value={formDailyDose}
                                        required
                                        onchange={handleFormChange}>
                                    </lightning-input>
                                </div>
                            </div>

                            <div class="slds-grid slds-wrap slds-gutters_small">
                                <div class="slds-col slds-size_1-of-1 slds-medium-size_6-of-12 slds-m-bottom_small">
                                    <lightning-input
                                        type="date"
                                        name="modalIssueDate"
                                        label="Issue Date"
                                        value={formIssueDate}
                                        required
                                        onchange={handleFormChange}>
                                    </lightning-input>
                                </div>
                                <div class="slds-col slds-size_1-of-1 slds-medium-size_6-of-12 slds-m-bottom_small">
                                    <lightning-input
                                        type="date"
                                        name="modalExpirationDate"
                                        label="Expiration Date (Max 12 Months)"
                                        value={formExpirationDate}
                                        required
                                        onchange={handleFormChange}>
                                    </lightning-input>
                                </div>
                            </div>

                            <div class="slds-m-bottom_small">
                                <lightning-textarea
                                    name="modalNotes"
                                    label="Clinical Diagnosis Notes &amp; Treatment Directives"
                                    value={formNotes}
                                    placeholder="Enter clinical evaluation findings, pharmacological contraindications, and dosage instructions..."
                                    rows="3"
                                    onchange={handleFormChange}>
                                </lightning-textarea>
                            </div>

                            <!-- Statutory Attestation -->
                            <div class="slds-box slds-theme_shade slds-m-top_small">
                                <div class="slds-form-element">
                                    <div class="slds-form-element__control">
                                        <lightning-input
                                            type="checkbox"
                                            label="Attestation: I certify that this patient has a diagnosed qualifying medical condition and is under my ongoing medical care. A cryptographic digital signature timestamp will be appended upon submission."
                                            checked={isAttested}
                                            onchange={handleAttestationChange}>
                                        </lightning-input>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Modal Footer -->
                    <footer class="slds-modal__footer">
                        <lightning-button label="Cancel" onclick={closeNewCertModal} class="slds-m-right_x-small"></lightning-button>
                        <lightning-button
                            variant="brand"
                            label="Submit &amp; Sign Recommendation"
                            icon-name="utility:lock"
                            disabled={isSubmitDisabled}
                            onclick={handleSubmitCertification}>
                        </lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>
    </div>
</template>
