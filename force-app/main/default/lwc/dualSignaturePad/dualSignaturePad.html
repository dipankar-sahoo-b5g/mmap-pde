<template>
    <div class="slds-card slds-p-around_medium mmap-header-card">
        <!-- Top Regulatory Navigation & Actions Bar -->
        <div class="slds-page-header slds-m-bottom_medium slds-box slds-theme_default">
            <div class="slds-page-header__row slds-grid_vertical-align-center">
                <div class="slds-page-header__col-title">
                    <div class="slds-media slds-no-space slds-grow">
                        <div class="slds-media__figure">
                            <lightning-icon icon-name="custom:custom98" size="medium" alternative-text="Manifest Transport"></lightning-icon>
                        </div>
                        <div class="slds-media__body">
                            <h1 class="slds-page-header__title slds-truncate mmap-title" title="Electronic Chain-of-Custody Manifests">
                                Electronic Shipping Manifest &amp; Dual-Signature Handshake
                            </h1>
                            <p class="slds-page-header__name-meta">
                                Official Pennsylvania DOH Regulatory Platform • Seed-to-Sale Chain-of-Custody (Act 16 / Sec 704)
                            </p>
                        </div>
                    </div>
                </div>
                <div class="slds-page-header__col-actions">
                    <div class="slds-grid slds-grid_vertical-align-center slds-gutters_small">
                        <!-- Manifest Switcher (Standalone mode) -->
                        <template lwc:if={isStandalone}>
                            <div class="slds-col" style="min-width: 220px;">
                                <lightning-combobox
                                    name="manifestSelect"
                                    label="Select Manifest"
                                    variant="label-hidden"
                                    value={selectedManifestId}
                                    options={manifestOptions}
                                    placeholder="Select Manifest..."
                                    onchange={handleManifestChange}>
                                </lightning-combobox>
                            </div>
                        </template>

                        <div class="slds-col">
                            <lightning-button-group>
                                <lightning-button
                                    label="Refresh"
                                    icon-name="utility:refresh"
                                    onclick={handleRefresh}>
                                </lightning-button>
                                <lightning-button
                                    label="New Manifest"
                                    icon-name="utility:add"
                                    onclick={openCreateModal}>
                                </lightning-button>
                                <lightning-button
                                    label="Sign Handshake"
                                    icon-name="utility:edit_form"
                                    variant="brand"
                                    onclick={openSignModal}
                                    disabled={isSignDisabled}>
                                </lightning-button>
                            </lightning-button-group>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <template lwc:if={isLoading}>
            <div class="slds-is-relative slds-p-around_large slds-text-align_center">
                <lightning-spinner alternative-text="Loading Manifest Data..." size="medium"></lightning-spinner>
                <p class="slds-m-top_medium slds-text-heading_small slds-text-color_weak">Synchronizing chain-of-custody ledger and digital signatures...</p>
            </div>
        </template>

        <template lwc:if={hasManifest}>
            <!-- Manifest Status Banner -->
            <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-m-bottom_medium slds-p-around_small slds-box slds-theme_shade">
                <div class="slds-grid slds-grid_vertical-align-center">
                    <span class="slds-text-heading_small slds-m-right_small"><strong>Manifest Number:</strong> {manifest.Name}</span>
                    <span class={statusBadgeClass}>{manifest.Status__c}</span>
                </div>
                <div>
                    <span class="slds-text-body_small slds-text-color_weak">Created: {formattedCreatedDate}</span>
                </div>
            </div>

            <!-- 3-Step Chain-of-Custody Progression -->
            <div class="slds-m-bottom_large">
                <div class="slds-text-title_caps slds-m-bottom_x-small" style="color: #0B5C43; font-weight: 700;">
                    Regulatory Chain of Custody &amp; Handshake Verification
                </div>
                <div class="custody-steps-container">
                    <!-- Step 1: Origin Dispatcher -->
                    <div class={step1Class}>
                        <div class="custody-step-header">
                            <div class="step-indicator">1</div>
                            <div class="step-title">Origin Dispatcher Sign-off</div>
                        </div>
                        <p class="slds-text-body_small slds-m-bottom_x-small slds-text-color_weak">
                            Outbound pre-transport seal &amp; scale weight verification.
                        </p>
                        <template lwc:if={manifest.Dispatcher_Signature__c}>
                            <div class="signature-display">
                                🔒 {manifest.Dispatcher_Signature__c}
                            </div>
                        </template>
                        <template lwc:else>
                            <div class="signature-pending">
                                ⏳ Pending Dispatcher Signature
                            </div>
                        </template>
                    </div>

                    <!-- Step 2: Transporter Acceptance -->
                    <div class={step2Class}>
                        <div class="custody-step-header">
                            <div class="step-indicator">2</div>
                            <div class="step-title">Transporter In-Transit Acceptance</div>
                        </div>
                        <p class="slds-text-body_small slds-m-bottom_x-small slds-text-color_weak">
                            Commercial driver physical custody &amp; route assumption.
                        </p>
                        <template lwc:if={manifest.Transporter_Signature__c}>
                            <div class="signature-display">
                                🚚 {manifest.Transporter_Signature__c}
                            </div>
                        </template>
                        <template lwc:else>
                            <div class="signature-pending">
                                ⏳ Pending Transporter Signature
                            </div>
                        </template>
                    </div>

                    <!-- Step 3: Vault Receiving Dual-Signature -->
                    <div class={step3Class}>
                        <div class="custody-step-header">
                            <div class="step-indicator">3</div>
                            <div class="step-title">Vault Receiving Dual-Signature</div>
                        </div>
                        <p class="slds-text-body_small slds-m-bottom_x-small slds-text-color_weak">
                            Destination facility package intake &amp; inventory reconciliation.
                        </p>
                        <template lwc:if={manifest.Receiver_Signature__c}>
                            <div class="signature-display">
                                ✅ {manifest.Receiver_Signature__c}
                            </div>
                        </template>
                        <template lwc:else>
                            <div class="signature-pending">
                                ⏳ Pending Receiving Vault Signature
                            </div>
                        </template>
                    </div>
                </div>
            </div>

            <!-- Route & Transport Details Grid -->
            <div class="manifest-summary-grid">
                <!-- Origin Facility -->
                <div class="summary-tile">
                    <div class="summary-tile-label">Origin Facility (Shipper)</div>
                    <div class="summary-tile-value">{originFacilityName}</div>
                    <div class="summary-tile-sub">Premise ID: {originFacilityRegistryId}</div>
                </div>

                <!-- Destination Facility -->
                <div class="summary-tile">
                    <div class="summary-tile-label">Destination Facility (Receiver)</div>
                    <div class="summary-tile-value">{destinationFacilityName}</div>
                    <div class="summary-tile-sub">Premise ID: {destinationFacilityRegistryId}</div>
                </div>

                <!-- Transport Logistics -->
                <div class="summary-tile">
                    <div class="summary-tile-label">Carrier &amp; Driver</div>
                    <div class="summary-tile-value">{driverDisplayName}</div>
                    <div class="summary-tile-sub">License: {driverLicenseDisplay} • Transporter: {transporterFacilityName}</div>
                </div>

                <!-- Vehicle & Schedule -->
                <div class="summary-tile">
                    <div class="summary-tile-label">Vehicle &amp; Timestamps</div>
                    <div class="summary-tile-value">Plate: {vehiclePlateDisplay} • VIN: {vehicleVINDisplay}</div>
                    <div class="summary-tile-sub">Departed: {departureDisplay} • Arrival: {arrivalDisplay}</div>
                </div>
            </div>

            <!-- Security & Route Notes if available -->
            <template lwc:if={manifest.Security_Notes__c}>
                <div class="slds-box slds-m-bottom_medium slds-theme_shade">
                    <p class="slds-text-title_caps slds-m-bottom_xx-small"><strong>Security &amp; Route Instructions:</strong></p>
                    <p class="slds-text-body_regular">{manifest.Security_Notes__c}</p>
                </div>
            </template>

            <!-- Line Items Table -->
            <div class="slds-card slds-box slds-m-bottom_medium">
                <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-m-bottom_small">
                    <div>
                        <h2 class="slds-text-heading_small">
                            <strong>Manifest Line Items ({lineItemCount})</strong>
                        </h2>
                        <p class="slds-text-body_small slds-text-color_weak">
                            Serialized inventory units secured under this transfer manifest.
                        </p>
                    </div>
                    <div>
                        <span class="slds-badge slds-theme_success">
                            Total Gross Weight: {totalGrossWeight} g
                        </span>
                    </div>
                </div>

                <template lwc:if={hasLineItems}>
                    <div class="slds-table_responsive slds-scrollable_x">
                        <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_striped">
                            <thead>
                                <tr class="slds-line-height_reset">
                                    <th scope="col"><div class="slds-truncate" title="Line Item">Item #</div></th>
                                    <th scope="col"><div class="slds-truncate" title="RFID Tag">State 24-Char RFID</div></th>
                                    <th scope="col"><div class="slds-truncate" title="Package Number">Package #</div></th>
                                    <th scope="col"><div class="slds-truncate" title="Product Type">Product Category</div></th>
                                    <th scope="col"><div class="slds-truncate" title="Gross Weight">Gross Weight (g)</div></th>
                                    <th scope="col"><div class="slds-truncate" title="Units">Units</div></th>
                                    <th scope="col"><div class="slds-truncate" title="Lab Status">Lab Safety Status</div></th>
                                </tr>
                            </thead>
                            <tbody>
                                <template for:each={lineItems} for:item="item">
                                    <tr key={item.Id}>
                                        <td><div class="slds-truncate">{item.Name}</div></td>
                                        <td>
                                            <div class="slds-truncate">
                                                <code style="background: #f1f5f9; padding: 2px 6px; border-radius: 3px; font-weight: bold;">
                                                    {item.Package_RFID__c}
                                                </code>
                                            </div>
                                        </td>
                                        <td><div class="slds-truncate">{item.packageName}</div></td>
                                        <td><div class="slds-truncate">{item.productType}</div></td>
                                        <td><div class="slds-truncate"><strong>{item.Gross_Weight_Grams__c} g</strong></div></td>
                                        <td><div class="slds-truncate">{item.Item_Count__c}</div></td>
                                        <td>
                                            <span class="slds-badge slds-theme_success">
                                                {item.labStatus}
                                            </span>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </template>
                <template lwc:else>
                    <div class="slds-p-around_medium slds-text-align_center slds-text-color_weak">
                        No product packages attached to this manifest yet.
                    </div>
                </template>
            </div>
        </template>
        <template lwc:else>
            <template lwc:if={hasNoManifests}>
                <div class="slds-box slds-text-align_center slds-p-around_xx-large">
                    <lightning-icon icon-name="custom:custom98" size="large" alternative-text="No Manifests"></lightning-icon>
                    <h2 class="slds-m-top_medium slds-text-heading_medium">No Shipping Manifests Found</h2>
                    <p class="slds-m-top_small slds-text-color_weak">Click "New Manifest" above to initiate a regulatory transfer.</p>
                    <div class="slds-m-top_medium">
                        <lightning-button variant="brand" label="Create First Manifest" onclick={openCreateModal}></lightning-button>
                    </div>
                </div>
            </template>
        </template>

        <!-- MODAL: Sign Manifest -->
        <template lwc:if={isSignModalOpen}>
            <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open slds-modal_medium" aria-labelledby="modal-heading-sign">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <lightning-button-icon
                            icon-name="utility:close"
                            alternative-text="Close"
                            variant="bare-inverse"
                            class="slds-modal__close"
                            onclick={closeSignModal}>
                        </lightning-button-icon>
                        <h2 id="modal-heading-sign" class="slds-text-heading_medium slds-hyphenate">
                            ✍️ Digital Chain-of-Custody Handshake
                        </h2>
                        <p class="slds-m-top_x-small slds-text-body_small slds-text-color_weak">
                            Manifest #{manifest.Name} • Physical Handshake Attestation
                        </p>
                    </header>

                    <div class="slds-modal__content slds-p-around_medium">
                        <div class="slds-form slds-form_stacked">
                            <!-- Role Selection -->
                            <lightning-combobox
                                name="signRole"
                                label="Signer Official Role"
                                value={signRole}
                                options={roleOptions}
                                placeholder="Choose Signer Role..."
                                onchange={handleRoleChange}
                                required>
                            </lightning-combobox>

                            <!-- Signer Legal Name -->
                            <lightning-input
                                class="slds-m-top_small"
                                name="signerName"
                                label="Legal Full Name of Authorized Signer"
                                value={signerName}
                                placeholder="e.g. Marcus Vance, Vault Inspector"
                                onchange={handleSignerNameChange}
                                required>
                            </lightning-input>

                            <!-- Next Status Preview -->
                            <div class="slds-box slds-m-top_medium slds-theme_shade">
                                <p class="slds-text-body_small">
                                    <strong>Workflow Action:</strong> Signing as <strong>{signRole}</strong> will advance manifest status to <span class="slds-badge slds-theme_info">{nextStatusLabel}</span>.
                                </p>
                            </div>

                            <!-- Statutory Attestation Checkbox -->
                            <div class="attestation-box">
                                <lightning-input
                                    type="checkbox"
                                    name="attestation"
                                    label="Legal Chain-of-Custody Attestation"
                                    checked={hasAttested}
                                    onchange={handleAttestationChange}>
                                </lightning-input>
                                <p class="slds-m-top_xx-small">
                                    <em>"I hereby certify under penalty of perjury and Section 704 of the Commonwealth Medical Marijuana Act that I have physically inspected and verified all tamper-evident seals, gross package weights, and state RFID tags listed on this electronic manifest."</em>
                                </p>
                            </div>
                        </div>
                    </div>

                    <footer class="slds-modal__footer">
                        <lightning-button label="Cancel" onclick={closeSignModal} class="slds-m-right_small"></lightning-button>
                        <lightning-button
                            variant="brand"
                            label="Sign &amp; Advance Custody"
                            icon-name="utility:lock"
                            onclick={submitSignature}
                            disabled={isSubmitSignDisabled}>
                        </lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>

        <!-- MODAL: Create New Manifest -->
        <template lwc:if={isCreateModalOpen}>
            <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open slds-modal_large" aria-labelledby="modal-heading-create">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <lightning-button-icon
                            icon-name="utility:close"
                            alternative-text="Close"
                            variant="bare-inverse"
                            class="slds-modal__close"
                            onclick={closeCreateModal}>
                        </lightning-button-icon>
                        <h2 id="modal-heading-create" class="slds-text-heading_medium slds-hyphenate">
                            📦 Create Electronic Shipping Manifest
                        </h2>
                        <p class="slds-m-top_x-small slds-text-body_small slds-text-color_weak">
                            Initiate outbound commercial cannabis transfer and attach serialized RFID packages
                        </p>
                    </header>

                    <div class="slds-modal__content slds-p-around_medium">
                        <div class="slds-grid slds-gutters slds-wrap">
                            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                                <lightning-combobox
                                    name="newOrigin"
                                    label="Origin Facility (Shipper)"
                                    value={newOriginId}
                                    options={facilityOptions}
                                    placeholder="Select Origin..."
                                    onchange={handleNewOriginChange}
                                    required>
                                </lightning-combobox>
                            </div>
                            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                                <lightning-combobox
                                    name="newDestination"
                                    label="Destination Facility (Receiver)"
                                    value={newDestinationId}
                                    options={facilityOptions}
                                    placeholder="Select Destination..."
                                    onchange={handleNewDestinationChange}
                                    required>
                                </lightning-combobox>
                            </div>

                            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3 slds-m-top_small">
                                <lightning-combobox
                                    name="newTransporter"
                                    label="Transporter Facility"
                                    value={newTransporterId}
                                    options={facilityOptions}
                                    placeholder="Select Carrier (optional)..."
                                    onchange={handleNewTransporterChange}>
                                </lightning-combobox>
                            </div>
                            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3 slds-m-top_small">
                                <lightning-input
                                    name="newDriverName"
                                    label="Driver Full Name"
                                    value={newDriverName}
                                    placeholder="Commercial Driver Name"
                                    onchange={handleNewDriverNameChange}>
                                </lightning-input>
                            </div>
                            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3 slds-m-top_small">
                                <lightning-input
                                    name="newDriverLicense"
                                    label="Driver License #"
                                    value={newDriverLicense}
                                    placeholder="e.g. PA-CDL-88219"
                                    onchange={handleNewDriverLicenseChange}>
                                </lightning-input>
                            </div>

                            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-m-top_small">
                                <lightning-input
                                    name="newVehicleVIN"
                                    label="Vehicle 17-Char VIN"
                                    value={newVehicleVIN}
                                    max-length="17"
                                    placeholder="17-Character VIN"
                                    onchange={handleNewVehicleVINChange}>
                                </lightning-input>
                            </div>
                            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-m-top_small">
                                <lightning-input
                                    name="newVehiclePlate"
                                    label="Vehicle License Plate"
                                    value={newVehiclePlate}
                                    placeholder="e.g. PA-CMM-4821"
                                    onchange={handleNewVehiclePlateChange}>
                                </lightning-input>
                            </div>
                        </div>

                        <!-- Available Packages Selection -->
                        <div class="slds-m-top_large">
                            <h3 class="slds-text-heading_small slds-m-bottom_x-small">
                                <strong>Select Packages to Transfer from Origin Vault ({selectedPackageIds.length} Selected)</strong>
                            </h3>
                            <template lwc:if={hasAvailablePackages}>
                                <div class="slds-table_responsive slds-scrollable_y" style="max-height: 220px; border: 1px solid #e2e8f0; border-radius: 4px;">
                                    <table class="slds-table slds-table_cell-buffer slds-table_bordered">
                                        <thead>
                                            <tr class="slds-line-height_reset">
                                                <th style="width: 3.25rem;"></th>
                                                <th>Package #</th>
                                                <th>RFID Tag</th>
                                                <th>Category</th>
                                                <th>Weight (g)</th>
                                                <th>Lab Status</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <template for:each={availablePackages} for:item="pkg">
                                                <tr key={pkg.Id}>
                                                    <td>
                                                        <lightning-input
                                                            type="checkbox"
                                                            data-id={pkg.Id}
                                                            checked={pkg.isSelected}
                                                            onchange={handlePackageSelection}>
                                                        </lightning-input>
                                                    </td>
                                                    <td>{pkg.Name}</td>
                                                    <td><code>{pkg.RFID_Tag__c}</code></td>
                                                    <td>{pkg.Product_Type__c}</td>
                                                    <td>{pkg.Net_Weight_Grams__c} g</td>
                                                    <td><span class="slds-badge slds-theme_success">{pkg.Lab_Safety_Status__c}</span></td>
                                                </tr>
                                            </template>
                                        </tbody>
                                    </table>
                                </div>
                            </template>
                            <template lwc:else>
                                <div class="slds-box slds-theme_shade slds-text-align_center slds-text-color_weak">
                                    <p>Select an Origin Facility with approved inventory to attach product packages.</p>
                                </div>
                            </template>
                        </div>
                    </div>

                    <footer class="slds-modal__footer">
                        <lightning-button label="Cancel" onclick={closeCreateModal} class="slds-m-right_small"></lightning-button>
                        <lightning-button
                            variant="brand"
                            label="Create Manifest &amp; Generate Line Items"
                            icon-name="utility:save"
                            onclick={submitCreateManifest}
                            disabled={isSubmitCreateDisabled}>
                        </lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>
    </div>
</template>
